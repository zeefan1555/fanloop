schema_version: 2

prompts:
  panorama_condition:
    prompt: |
      进入当前 Step 后展示最新 Panorama。只有已把本次 data.content 原样发到用户可见通道的父 Agent 或当前宿主才返回本次精确快照路径；失败时保持 blocked。headless 子 Agent 不上报。
      The child must not submit panorama_presented.
      After non-dry-run fanloop card render --view panorama --format markdown, the child stops and returns data.content and data.snapshot_path to the parent; report blocked if render fails.
      The parent sends the exact data.content as the first user-visible message for that Step, then reports panorama_presented with that same snapshot_path, then continues the Step business Prompt.
      Never run a panorama-gated Workflow fully headless in a child that cannot post user-visible messages.
      公开 CLI 不证明用户看见了消息。
    skills:
      - {id: example-panorama, prompt: "The child must not submit panorama_presented. The parent sends the exact data.content as the first user-visible message for that Step, then reports panorama_presented with that same snapshot_path, then continues the Step business Prompt. Never run a panorama-gated Workflow fully headless in a child that cannot post user-visible messages.", optional: false}

  analyze_materials_flow:
    prompt: 读取用户材料，区分已确认事实与开放问题，形成可供后续产出的材料摘要。
    skills:
      - {id: example-analyze-materials, prompt: 分析材料并写出最小、可追溯的摘要。, optional: false}
  draft_result_flow:
    prompt: 只依据已确认材料形成结果草案；材料变化则回到理解材料，局部问题留在本 Step 修订。
    skills:
      - {id: example-draft-result, prompt: 从材料摘要生成可审核草案。, optional: false}
  confirm_result_flow:
    prompt: 展示草案并等待人明确批准或提出修改；不得代替人批准。
    skills: []

  materials_analyzed_condition:
    prompt: 摘要已覆盖目标、输入、约束、预期输出和开放问题时返回摘要路径。
    skills: []
  materials_incomplete_condition:
    prompt: 缺少阻塞性材料时返回具体缺口，不补造事实。
    skills: []
  draft_written_condition:
    prompt: 草案已落盘且只使用已确认材料时返回草案路径。
    skills: []
  materials_changed_condition:
    prompt: 新信息改变材料理解时返回原因并回到理解材料。
    skills: []
  draft_needs_revision_condition:
    prompt: 材料未变但草案仍需修订时返回具体原因。
    skills: []
  result_approved_condition:
    prompt: 只接受人的全新明确批准。
    skills: []
  result_changes_requested_condition:
    prompt: 人要求修改时原样保留可执行反馈。
    skills: []

  retry_materials:
    prompt: 补齐缺失材料后重新分析。
    skills: []
  reanalyze_materials:
    prompt: 材料发生变化，回到最早受影响的理解步骤。
    skills: []
  revise_draft:
    prompt: 材料未变，留在当前步骤修订草案。
    skills: []
  revise_after_review:
    prompt: 按人工反馈返回草案步骤修订。
    skills: []
