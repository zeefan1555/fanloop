schema_version: 2

prompts:
  maintenance_step_dispatch:
    prompt: |
      先执行公共路由 Skill：仅 Define 判断改动类别；其他 Step 读取 Define 已记录的 maintenance_kind，选择相同类别 Route。
      配置业务只从所选 Route 的 Condition Prompt 加载对应 fanloop-config-* Skill；代码业务执行所选 code Route 的原 Prompt/Skills。当前入口不承载两种业务操作说明。
    skills:
      - {id: fanloop-dev-workflow, prompt: Define 分类并记录，后续只按已记录类别加载当前 Step 的独立业务 Skill。, optional: false}

  configuration_scope_recorded_condition:
    prompt: 执行配置 Define Skill，在唯一 delivery-record.md 简记已明确目标、范围和检查方式（self_check、independent 或 not_applicable）；记录最小场景、成功标准、副作用和停止位置后返回 configuration_scope_recorded。
    skills:
      - {id: fanloop-config-define, prompt: 只执行当前配置 Step 的职责并保留真实回执。, optional: false}

  configuration_changes_written_condition:
    prompt: 执行绑定的配置专用 Skill，真实完成后返回 configuration_changes_written；失败或结果不明保持 blocked。
    skills:
      - {id: fanloop-config-edit, prompt: 只执行当前配置 Step 的职责并保留真实回执。, optional: false}

  configuration_checked_condition:
    prompt: 执行配置检查 Skill；普通模板及 Prompt 由当前 Agent 实际自检，路由、绑定、权限、安全、审批或外部写入规则变化必须独立试用，纯排版可记录具体免测理由。核对实际验证方式与原始证据；基础检查通过且 trial 为 passed 或有据的 not_applicable 才返回 configuration_checked；行为失败回 Build，环境阻塞保持 blocked。
    skills:
      - {id: fanloop-config-check, prompt: 按影响完成自检或独立试用，核验原始产物与候选身份，不重复已完成检查。, optional: false}

  live_configuration_synced_condition:
    prompt: 执行绑定的配置专用 Skill，真实完成后返回 live_configuration_synced；失败或结果不明保持 blocked。
    skills:
      - {id: fanloop-config-deliver, prompt: 只执行当前配置 Step 的职责并保留真实回执。, optional: false}

  maintenance_kind_condition:
    prompt: Define 按实际范围选择 configuration 或 code 并写入 maintenance_kind；后续 Result 沿用当前有效 Output 的类别。范围变化先携原类别回 Define，禁止在后续 Step 自行改类。
    skills: []
  configuration_fact_condition:
    prompt: 只记录当前配置 Step 已发生的事实与真实证据。按当前 Prompt 填写对象；错误记录具体原因，未完成或结果不明保持 blocked。
    skills: []
  configuration_back_to_define:
    prompt: 目标、验收、权限、副作用或变更类别扩大时回 Define；同一目标关联说明同步只更新实际文件清单，不机械回流。涉及代码后执行原代码分支，不复用配置检查作为代码验收。
    skills: []
  configuration_back_to_build:
    prompt: 仅修复配置问题或基于最新仓库基线重新准备完整 Skill 包，再重新做相关配置检查。本地交付后回读失败保持原 Step blocked，修复同一源的读取问题后重试。
    skills: []

  panorama_delivery_condition:
    prompt: 进入当前 Step 后立即把最新 Panorama 作为第一条用户可见消息完整展示；成功后返回本次非 dry-run render 的精确 snapshot_path，失败时保持 blocked。
    skills:
      - {id: fanloop-dev-panorama, prompt: 展示 renderer 生成的唯一 Panorama，并返回精确 snapshot_path。, optional: false}

  define_report_condition:
    prompt: 发布并回读本 Requirement 的 Define 飞书报告；内容必须覆盖目标、范围、非目标、验收标准与试用计划。成功后返回 define_report_published，失败或结果不明保持 blocked。
    skills:
      - {id: fanloop-stage-report, prompt: 发布并回读 Define 阶段报告，返回精确飞书文档 URL。, optional: false}
  build_report_condition:
    prompt: 发布并回读本 Requirement 的 Build 飞书报告；内容必须覆盖实际变更、实现或配置结果、自验证与候选身份。成功后返回 build_report_published，失败或结果不明保持 blocked。
    skills:
      - {id: fanloop-stage-report, prompt: 发布并回读 Build 阶段报告，返回精确飞书文档 URL。, optional: false}
  certification_report_document_condition:
    prompt: 发布并回读本 Requirement 的 Certify 飞书报告；内容必须覆盖配置检查与独立试用，或代码 Review、黑盒验证、主 Agent 决定和最终候选身份。成功后返回 certification_report_published，失败或结果不明保持 blocked。
    skills:
      - {id: fanloop-stage-report, prompt: 发布并回读 Certify 阶段报告，返回精确飞书文档 URL。, optional: false}

  define_verification_contract_flow:
    prompt: |
      准备独立 Issue Workspace、源码 worktree 和最新 main 基线。把用户已对齐的目标、范围、非目标、风险边界、Acceptance Set 与 Feature Impact Set 写入并回读 requirements.md。Acceptance Set 保留一至三个端到端场景；Feature Impact Set 列出全部受影响 Feature、公开入口以及关键成功和失败状态。每个场景固定公开命令、独立预期、退出码、可观察状态、副作用、证据和停止位置。

      执行子 Agent向主 Agent申请批准或拒绝，不得自批。使用 decision receipt 记录明确决定。批准前不得修改受管代码；批准后执行 define_report_published 对应 Skill，发布并回读 Define 飞书报告，再上报 verification_contract_written、requirements_approved、requirements_decision_recorded、define_report_published 与 panorama_presented。拒绝时上报对应拒绝组合并终止。
    skills:
      - {id: fanloop-dev-bootstrap, prompt: 准备独立工作区、源码 worktree 和最新 main 基线。, optional: false}
      - {id: fanloop-dev-grill-with-docs, prompt: 生成 requirements.md、Acceptance Set、Feature Impact Set 并记录主 Agent决定。, optional: false}
      - {id: fanloop-dev-grilling, prompt: 按 design-tree/frontier 澄清仍未闭合的目标和边界。, optional: false}
      - {id: fanloop-dev-domain-modeling, prompt: 挑战含混术语并整理需进入契约真值或 ADR 的决定。, optional: false}
      - {id: fanloop-dev-decision-receipt, prompt: 安全记录并回读主 Agent需求决定。, optional: false}
  define_verification_contract_rejected_terminal:
    prompt: 主 Agent已拒绝当前 Verification Contract；保留 requirements.md 与 decision receipt 后结束。
    skills: []

  build_until_verified_flow:
    prompt: |
      当前执行 Agent直接在同一实现上下文完成方案、最小修改和自主验证。复杂度确实需要跨模块协调、方案取舍或并行拆分时才创建 spec.md 或 Tickets；它们不是独立门禁。持续执行：建立或复现基线 -> 最小修改 -> 聚焦测试 -> ./tests/run-unit -> 按 Feature Impact Set 使用真实公开 CLI 验证 -> 捕获证据和副作用 -> 分类失败并修复。

      用户表面变化时同步维护 Verification Skill 与 Feature Map。源码、测试或验证资产任一变化都产生新候选并使旧证据失效。只有存在新的可证伪假设时继续重试；同一失败重复且无新证据、环境或授权不可达时保持 blocked。需求或验收契约变化时上报 requirements_changed 回 Define。

      全部通过后提交当前分支，要求工作树 clean。记录 candidate_base、candidate_head、Git tree、patch SHA-256、候选 binary SHA-256、Acceptance/Impact 覆盖、run ID、manifest/snapshot、失败分类、修复和 ADR impact 到 verification-report.md。执行 build_report_published 对应 Skill，发布并回读 Build 飞书报告，再上报 self_validation_passed、verification_report_written、candidate_identity_recorded、build_report_published 与 panorama_presented。本 Step 不 push、不创建 PR。
    skills:
      - {id: fanloop-dev-tdd, prompt: 在已约定公开 Test Seam 上完成适用的 red-green；不适用项记录理由。, optional: false}
      - {id: fanloop-dev-implement, prompt: 持续完成实现、自验证、失败诊断、修复、候选提交和 verification-report.md。, optional: false}
      - {id: fanloop-dev-maintain-verification, prompt: 用户表面变化时维护 Verification Skill 与 Feature Map，并完成 source + live 验证。, optional: true}
      - {id: fanloop-dev-to-spec, prompt: 仅在复杂度确实需要时生成辅助 Spec。, optional: true}
      - {id: fanloop-dev-to-tickets, prompt: 仅在存在可独立并行的纵向工作时生成辅助 Tickets。, optional: true}

  certify_candidate_flow:
    prompt: |
      fetch origin 并执行 Pre-Certify：复核 requirements.md、完整 diff、相关 ADR、生成物、Feature Map、本地 passed manifest、外部依赖和工作树 clean，再冻结 certification_base、certification_head、Git tree、候选 patch identity 和 binary SHA-256；要求 HEAD=certification_head 且候选 diff 仍以记录的 certification_base 为基线。origin/main 后续前进只作为交付上下文记录，不使未改变的候选失效。

      Pre-Certify 通过后同时派发两个不继承实现上下文的全新 Sub-agent：Reviewer 读取 requirements.md、相关 ADR 和完整 diff；Verifier 不读源码，只用隔离 candidate CLI、叶子 Help、Feature Map 和 Acceptance Set 做真实黑盒验证。两者必须读取同一 certification identity，使用互不共享的可写目录并各自保留原始 receipt。等待两者全部结束，不因一方先失败而中断另一方。任一候选源码、测试或验证资产变化都使两项结果失效并回 Build。

      执行子 Agent聚合前再次核验候选身份。Review 与黑盒都通过后，向主 Agent申请最终候选决定，使用 decision-receipt Skill 写入并精确回读 receipt。把原始回执、身份、覆盖和决定写入 certification-report.md。通过后执行 certification_report_published 对应 Skill，发布并回读 Certify 飞书报告，再上报 independent_review_passed、blackbox_verification_passed、main_agent_acceptance_passed、main_agent_acceptance_recorded、certification_report_written、certification_identity_frozen、certification_report_published 与 panorama_presented。Review、黑盒或主 Agent要求修改时写完本地报告并选择对应失败 Condition 回 Build；目标变化回 Define；基础设施不可达保持 blocked。
    skills:
      - {id: fanloop-dev-code-review, prompt: 对冻结候选执行独立整体 Review 并返回原始回执。, optional: false}
      - {id: fanloop-dev-agent-acceptance, prompt: 对冻结候选执行无源码上下文的公开 CLI 黑盒验证。, optional: false}
      - {id: fanloop-dev-verify, prompt: 使用隔离候选、Feature Map 和 Acceptance Set 保留真实验证证据。, optional: false}
      - {id: fanloop-dev-decision-receipt, prompt: 安全记录并回读主 Agent最终候选决定。, optional: false}

  merge_and_update_local_flow:
    prompt: |
      从 certification-report.md 覆盖的 certification_base、certification_head、Git tree、候选 patch identity、binary SHA-256 和验证资产摘要开始。先跨 open/merged 状态回读当前分支到 main 的唯一 PR；若已 MERGED，固定其唯一 merge commit 并直接恢复合并后本地步骤，不再处理 base drift。PR 尚未合并时 fetch origin；origin/main 未变化则把 certification_base/head 作为有效交付 base/head 并上报 delivery_main_unchanged。origin/main 已前进时，在 Deliver 用普通 merge 把该精确提交集成到当前分支，解决冲突并记录冲突文件；禁止 rebase、force push 或夹带需求外修改。对集成后的 diff 执行 git diff --check、受影响聚焦检查和 ./tests/run-unit。若无法保持已批准的需求、Workflow Step 身份、IDL、Schema 或公开语义，上报 requirements_changed 回 Define；其他非集成修改或身份漂移上报 candidate_changed 回 Build。集成验证通过后固定 delivery_base、delivery_head 和 delivery_tree，只上报 delivery_main_integrated、panorama_presented 与 code_change 回 Build；旧 Review、黑盒、主 Agent批准、PR checks 和交付证据全部失效，必须以实际 delivery_head 重新完成 Build 与 Certify。

      只有当前候选已经对实际 HEAD 完成新一轮 Build、独立 Review、黑盒验收与主 Agent批准，且 origin/main 等于本轮 certification_base，才幂等创建或更新当前分支到 main 的唯一 PR。从 active main Ruleset 动态读取 required checks 的精确名称集合；无论集合是否包含 changes，均须回读有效交付 head 的 changes 成功结论及真实 code 输出，代码或混合变更必须为 true。不得用本地分流、检查名称或 skipped 推断输出；缺失、失败、取消或无效输出均阻止交付。等待全部适用 required checks 成功，并同步本轮独立 Review 结论。产品类检查失败上报 remote_product_checks_failed 回 Build；基础设施失败保持 blocked。全部通过后再次 fetch；若 main 又前进则重复受控集成并回 Build 重新认证，否则核对 PR source commit 等于有效交付 head，并执行 `gh pr merge <PR_URL> --repo zeefan1555/fanloop --auto --squash --match-head-commit <EFFECTIVE_DELIVERY_HEAD>`。禁止 `--admin`、直接 push main 或第二个 PR。

      回读 MERGED 和唯一 merge commit，要求其可达 origin/main，且 parent 形态只能是有效交付 base 的单父提交，或依次为有效交付 base、有效交付 head 的双父 GitHub merge；其他形态 blocked。比较 merge commit tree 与有效交付 head tree，必须相同。固定当前 Requirement 控制器，只把本 Requirement 的 clean 源码 worktree切到 detached merge commit；从该提交更新全局 current，回读 version 和 Doctor，再运行 post-merge verify smoke。全部通过后写入 delivery-record.md，只上报本次实际的 delivery_main_unchanged 或 delivery_pr_already_merged，以及 merge_request_published、remote_checks_passed、review_comment_synced、code_merged、merge_tree_verified、source_repository_updated、local_cli_updated、post_merge_smoke_passed、delivery_record_written 与 panorama_presented 后 terminal。已合并后的本地失败只重试同一 merge commit。
    skills:
      - {id: fanloop-dev-merge-and-update-local, prompt: 交付已认证候选，校验 merge tree，并从精确 merge commit 更新源码 worktree和全局 current。, optional: false}

  verification_contract_condition: {prompt: verification_contract_written 输出包含 Acceptance Set、Feature Impact Set、边界、风险与停止条件的 requirements.md。, skills: []}
  requirements_decision_condition: {prompt: 根据主 Agent明确决定选择 requirements_approved 或 requirements_rejected；二者只能一个。, skills: []}
  requirements_decision_record_condition: {prompt: requirements_decision_recorded 输出精确回读的主 Agent decision receipt ID。, skills: []}
  requirements_changed_condition: {prompt: 目标、范围、验收标准或治理契约变化时上报 requirements_changed。, skills: []}
  self_validation_condition: {prompt: 聚焦测试、./tests/run-unit 和 Feature Impact Set 的真实公开 CLI 验证全部覆盖最终候选时上报 self_validation_passed。, skills: []}
  verification_report_condition: {prompt: verification_report_written 输出引用原始 run/manifest/snapshot 并记录候选身份、覆盖、失败分类、修复和 ADR impact 的 verification-report.md。, skills: []}
  candidate_identity_condition: {prompt: candidate_identity_recorded 输出严格对象，至少包含 candidate_base、candidate_head、git_tree、patch_sha256、binary_sha256、verification_contract_sha256 和 feature_impact_sha256。, skills: []}
  candidate_change_condition: {prompt: HEAD、Git tree、binary、验证资产、工作树或报告身份不一致时上报 candidate_changed。, skills: []}
  independent_review_condition: {prompt: 按独立 Reviewer 原始结论选择 independent_review_passed 或 independent_review_failed。, skills: []}
  blackbox_verification_condition:
    prompt: 按无源码上下文 Verifier 原始结论选择 blackbox_verification_passed 或 blackbox_verification_failed。Evidence 指向本次 fanloop verify 写出的 schema-1 manifest.json，且 outcome 与枚举一致。
    skills:
      - {id: fanloop-dev-verify, prompt: 按证据门禁取证。禁止手写 manifest，禁止没有这次 verify 运行就上报 passed。OUTPUT_INVALID 时重跑 verify，按文件里的 outcome 重报。, optional: false}
  main_agent_acceptance_condition: {prompt: 按主 Agent明确最终决定选择 main_agent_acceptance_passed 或 main_agent_changes_requested。, skills: []}
  main_agent_acceptance_record_condition: {prompt: main_agent_acceptance_recorded 输出精确回读的主 Agent最终候选 decision receipt ID。, skills: []}
  certification_report_condition: {prompt: certification_report_written 输出引用独立 Review、黑盒证据、候选身份和主 Agent决定的 certification-report.md。, skills: []}
  certification_identity_condition: {prompt: certification_identity_frozen 输出严格对象，至少包含 certification_base、certification_head、git_tree、patch_sha256、binary_sha256 和 verification_assets_sha256；origin/main 后续前进不改变该身份。, skills: []}
  delivery_main_condition: {prompt: origin/main 等于 certification_base 时上报 delivery_main_unchanged；前进时在 Deliver 完成受控集成和检查后上报 delivery_main_integrated，对象至少包含 previous_base、latest_base、previous_head、delivery_head、delivery_tree、conflict_files 和 validation_commands。, skills: []}
  delivery_pr_status_condition: {prompt: 唯一 PR 已在当前或先前调用中合并并固定到同一 merge commit 时，上报 delivery_pr_already_merged=merged；该恢复路径不要求 delivery_main_unchanged。, skills: []}
  merge_request_condition: {prompt: merge_request_published 输出当前分支到 main 的唯一 GitHub PR URL。, skills: []}
  remote_checks_condition: {prompt: 有效交付 head 的 changes 成功且已回读真实 code 输出符合变更类别、适用 required checks 全部成功时上报 remote_checks_passed；分流不因未列入 required checks 而免查，不得从本地分流或 skipped 推断输出。该 head 是未漂移时的 certification_head 或受控集成后的 delivery_head。确定产品失败时上报 remote_product_checks_failed；基础设施失败不提交 Result。, skills: []}
  review_comment_condition: {prompt: review_comment_synced 输出本轮 actual delivery head 的独立 Review、黑盒验收、主 Agent批准结论及适用的 Deliver 集成回执同步到 PR 评论后的回读 receipt；不得复用或描述旧 certification head 的认证。, skills: []}
  code_merged_condition: {prompt: code_merged 输出回读 MERGED、符合已批准的有效交付 base 单父或有效交付 base/head 双父形态且可达目标默认分支的完整 merge commit SHA。, skills: []}
  merge_tree_condition: {prompt: merge commit tree 与有效交付 head tree完全相同时上报 merge_tree_verified。, skills: []}
  source_repository_updated_condition: {prompt: source_repository_updated 输出本任务源码 worktree detached 到的 merge commit SHA。, skills: []}
  local_cli_updated_condition: {prompt: local_cli_updated 输出全局 current version 回读的 merge commit SHA，且 Doctor healthy。, skills: []}
  post_merge_smoke_condition:
    prompt: 从 merge commit 安装的全局 current 完成 fanloop verify smoke 后，用该次写出的 schema-1 manifest.json 上报 post_merge_smoke_passed。
    skills:
      - {id: fanloop-dev-verify, prompt: 按证据门禁附上 smoke 写出的绝对路径 manifest.json，outcome 必须是 passed。禁止手写该文件。OUTPUT_INVALID 时重跑 smoke，按文件里的 outcome 重报。, optional: false}
  delivery_record_condition: {prompt: delivery_record_written 输出 delivery-record.md；代码交付记录原有 CLI/Doctor/smoke 证据，配置交付记录仓库绝对路径、Workflow ID、Git 基线及提交、完整包摘要、本地文件回读、配置 Doctor 与耗时。, skills: []}
  back_to_define: {prompt: 回到 Define，重新冻结 Verification Contract；旧候选、认证和交付证据全部失效。, skills: []}
  back_to_build: {prompt: 回到 Build，产生并验证新候选；旧认证、PR checks 和交付证据全部失效。, skills: []}
