schema_version: 3
conditions:
  panorama_presented:
    prompt_ref: {file: prompt.yaml, prompt_id: panorama_delivery_condition}
    output: {key: panorama_snapshot_path, type: path, description: 本次成功展示的精确 Panorama 快照}
  home_tag_ready:
    prompt_ref: {file: prompt.yaml, prompt_id: record_condition}
    output: {key: home_tag, type: object}
    exclusive_group: step_outcome
  flashcards_written:
    prompt_ref: {file: prompt.yaml, prompt_id: record_condition}
    output: {key: flashcard_receipt, type: object}
  preparation_recorded:
    prompt_ref: {file: prompt.yaml, prompt_id: record_condition}
    output: {key: preparation_receipt, type: object}
  draft_quality_passed:
    prompt_ref: {file: prompt.yaml, prompt_id: draft_quality_condition}
    output: {key: draft_quality, type: enum_value, values: [passed]}
  terms_ready:
    prompt_ref: {file: prompt.yaml, prompt_id: terms_ready_condition}
    output: {key: term_readiness, type: enum_value, values: [passed]}
  learning_preflight_passed:
    prompt_ref: {file: prompt.yaml, prompt_id: learning_preflight_condition}
    output: {key: learning_preflight, type: enum_value, values: [passed]}
  tag_approved:
    prompt_ref: {file: prompt.yaml, prompt_id: tag_approval_condition}
    output: {key: tag_approval, type: enum_value, values: [passed]}
  control_search_passed:
    prompt_ref: {file: prompt.yaml, prompt_id: control_search_condition}
    output: {key: control_search, type: enum_value, values: [passed]}
  combo_placed:
    prompt_ref: {file: prompt.yaml, prompt_id: combo_placement_condition}
    output: {key: combo_placement, type: enum_value, values: [passed]}
  aliases_written:
    prompt_ref: {file: prompt.yaml, prompt_id: alias_method_condition}
    output: {key: alias_method, type: enum_value, values: [passed]}
  retrospective_recorded:
    prompt_ref: {file: prompt.yaml, prompt_id: record_condition}
    output: {key: retrospective, type: object}
    exclusive_group: step_outcome
  terms_referenced:
    prompt_ref: {file: prompt.yaml, prompt_id: terms_referenced_condition}
    output: {key: term_reference_result, type: enum_value, values: [passed]}
  result_verified:
    prompt_ref: {file: prompt.yaml, prompt_id: record_condition}
    output: {key: verification_result, type: enum_value, values: [passed]}
    exclusive_group: step_outcome
  home_tag_needs_fix:
    prompt_ref: {file: prompt.yaml, prompt_id: record_condition}
    output: {key: repair_scope, type: enum_value, values: [home_tag]}
    exclusive_group: step_outcome
  flashcards_need_fix:
    prompt_ref: {file: prompt.yaml, prompt_id: record_condition}
    output: {key: repair_scope, type: enum_value, values: [flashcards]}
    exclusive_group: step_outcome
  term_refs_need_fix:
    prompt_ref: {file: prompt.yaml, prompt_id: record_condition}
    output: {key: repair_scope, type: enum_value, values: [term_refs]}
    exclusive_group: step_outcome
  verification_retry:
    prompt_ref: {file: prompt.yaml, prompt_id: record_condition}
    output: {key: repair_scope, type: enum_value, values: [verification]}
    exclusive_group: step_outcome
