schema_version: 2
prompts:
  panorama_delivery_condition:
    prompt: |
      每次进入 Step（包括回流重入）先执行绑定 Skill，展示 renderer 生成的最新 Panorama，再执行业务 Prompt。
      展示成功后保留本次精确 panorama_snapshot_path，与业务 Condition 一同上报；同一次 Step 内不重复展示。
      渲染或展示失败、结果不明时报告 blocked，不提交成功 Condition 或选择 Route。
    skills:
      - {id: workflow-panorama, prompt: 原样展示本次 Panorama，成功后返回精确 snapshot_path。, optional: false}

  resolve_home_tag_flow:
    prompt: |
      先执行 panorama_presented 的 Prompt/Skill；展示成功后再执行本步业务，并将展示回执与业务结果一起上报。
      直接使用前面对话中已讨论的概念、结论和来源；第一步就是定位 HOME 分类，不重新启动概念访谈。
      本 Workflow 用于已授权的制卡任务；只读查询不启动本流程。材料无法恢复或范围不清时报告 blocked，说明实际缺口。
      按 remnote-structure 定位唯一 HOME，在相关分类及祖先路径内搜索最具体的 Concept Tag，按真实 ID 消歧。
      已有合适 Tag 就复用；没有则先运行 remnote-cli status，确认连接、版本和写入权限，再在正确父级新建必要分类。
      回读确认 Tag 是 HOME 子树中的 Concept，纯分组节点按 Folder 处理，不按固定深度判型。
      home_tag_ready 的 object 包含 home_id、tag_id、ancestor_ids、created_tag_ids 和 source_refs；所有 ID 必须来自真实返回。
      本步完成条件是取得可用的真实 Tag ID，不能用待创建计划代替。
      全流程写前遵循 remnote-cli，写后立即回读。每次部分成功就在 progress Evidence 中保留对象 ID、动作和检查状态，供重试及回流恢复。
      运行输入记录内容模式、授权 KB 和当前材料范围；名称用于定位，ID 从当前连接取得，不写入样例知识库或固定分类 ID。
      已知对象按 remnote-cli 的 context 集中读取，只补缺失范围；权限、协议或工具故障记录 blocked，维护另开任务，不在制卡中改代码或重装插件。
      Output、Evidence 与 Summary 只保留 ID、来源引用、计数和检查结论；不保存 RemNote 内容的本地副本，临时传输文件用后清理。
    skills:
      - {id: remnote-structure, prompt: 查找或创建 HOME 分类并回读真实类型与父级。, optional: false}
      - {id: remnote-cli, prompt: 写前 status、命令帮助、精确 ID 操作和回读。, optional: false}

  write_flashcards_flow:
    prompt: |
      先执行 panorama_presented 的 Prompt/Skill；展示成功后再执行本步业务，并将展示回执与业务结果一起上报。
      使用已确定的 HOME Tag 和前面对话的学习成果，调用 remnote-flashcards 完成查重、制卡、自检与真实写入。
      按独立记忆目标查询已有卡片及原生复习证据：重复跳过，实质补充编辑原卡答案，新目标才创建；复习数据不可用时明确记为 unavailable，不推断掌握程度。
      普通卡按 remnote-flashcards Skill 的 STAR 通用解释结构完成费曼法、SuperMemo 与原子拆卡；细项按需展开，R 可合理省略，不编造结果。原文导入或摘录沿用对应模式，不改写指定原文。
      新单卡直接属于今日笔记并挂选定 Tag；同一学习链路 2–7 张卡属于普通 text 主题，只给主题打 Tag，并添加内置 Card Cluster；更多卡按学习链路拆组。
      先用 SDK 获取并核验今日笔记。更新原卡保留原位置、Rem ID、cardId 和复习记录；回流时先恢复 progress Evidence 中的 ID，只补缺项或原位修复。
      本步先把卡片写完整、保证独立可懂；保留已有有效 Wiki 引用，记录待关联概念，Wiki 创建/更新及新增引用统一留到 update_wiki_links，不写虚构引用或占位链接。
      按 remnote-cli 的有界任务协议使用 flashcards apply 完成计划、预览、写入及回执；未能保真表达的原文或结构不得强行套用。
      任务已完成的 Tag、Card Cluster 和结构检查不再逐卡重复调用；集群仍必须有 cc=true 的真实回读，主题类型、标题、父级和卡片集合符合预期。
      flashcards_written 的 object 包含 created_rem_ids、updated_rem_ids、reused_rem_ids、card_ids、topic_ids、daily_rem_ids、tag_id、source_refs、skipped_count 和待关联的卡片 ID。
      全部重复时允许 created/updated 为空，保留复用 ID 与跳过原因，仍进入 Wiki 更新及最终校验；不要为凑数量创建卡片。
      内容与结构已回读、批次 ID 已记录才能前进；分类错误回 resolve_home_tag，卡片缺陷或可恢复的部分写入回本步。缺少授权或结果不明则 blocked。
    skills:
      - {id: remnote-flashcards, prompt: 执行增量查重、制卡、自检、写入与集群；Wiki 更新和补引用留给下一步。, optional: false}
      - {id: remnote-cli, prompt: 写前 status，写入后逐项回读并记录真实 ID。, optional: false}

  update_wiki_links_flow:
    prompt: |
      先执行 panorama_presented 的 Prompt/Skill；展示成功后再执行本步业务，并将展示回执与业务结果一起上报。
      闪卡写入后，调用 remnote-wiki 定向查找本次概念的规范名和 aliases，复用唯一 Wiki 页面。
      对已有页面补充本次有依据的新知识；缺页且达到页面门槛时创建。没有知识增量则复用，不重复建页或追加相同内容。
      Wiki 页面保持正确 WIKI 分区下的普通 text；仅本批次写入页面时同步相关 index/log，保留真实来源和已有引用。
      同分区页面和答案引用优先组成一个 wiki apply 计划，按预算和跨批依赖拆分；无增量只复用，不凑页面数或重复追加日志。
      分组索引使用已核验的实际目标父 ID，不猜分组名称或层级；当前 CLI 无法表达必要操作时保持 blocked，不先部分写入再修补。
      获得真实 Wiki 页面 ID 后，在相关闪卡答案 Rem 中增加原生概念引用，并补齐必要的 Wiki 页面间引用；已有有效引用直接复用。
      引用不能替代卡片独立作答所需的定义、条件和结论；编辑必要答案 Rem，保留卡片正面、父级、Tag、ID 和复习记录，不重复追加链接。
      原文导入/摘录或没有可复用概念时，按现有 Skill 跳过不适用的 Wiki 写入和补引用，记录明确原因后继续最终校验。
      wiki_links_updated 的 object 包含 wiki_root_id（涉及 Wiki 时）、created_page_ids、updated_page_ids、reused_page_ids、linked_card_ids、reference_pairs 和不适用项原因。
      完成条件是所有适用的 Wiki 内容和引用均已真实更新或确认复用，并已逐项回读；不能用待写清单代替完成。
      分类问题回 resolve_home_tag，卡片内容问题回 write_flashcards，Wiki 或引用问题回本步。部分成功先记录真实 ID，再补缺项。
    skills:
      - {id: remnote-wiki, prompt: 定向查重、创建或更新概念页面并维护引用；原文模式按约定跳过。, optional: false}
      - {id: remnote-cli, prompt: 按真实 ID 写入 Wiki 和卡片答案中的引用，保留原对象并回读。, optional: false}

  verify_result_flow:
    prompt: |
      先执行 panorama_presented 的 Prompt/Skill；展示成功后再执行本步业务，并将展示回执与业务结果一起上报。
      调用 remnote-verify 对本批次最终真实内容完成质量与结构校验，包含第三步补引用后的卡片。
      检查卡片独立、原子、可判分、低干扰和可追溯；核对父级、日期、HOME Concept Tag 及反查、实际卡片 ID 集合、答案结构、Card Cluster 和引用可解析。
      新卡按实际创建日期核验，原卡更新保留原日期与 ID；本批次曾部分成功或回流时，不因日期变化重建已写卡片。
      本批次新增或修改 Wiki 时核对页面、aliases、来源、index/log，并完整确认 WIKI 子树零卡片；仅复用页面时检查受影响页面与引用，不扩大为全库审计。
      使用 context 和 verify scope 集中读取最终内容与检查结构，按 remnote-cli 的新鲜度规则复用未失效回执；Wiki 完整零卡片检查不能缩成抽样。
      普通卡按最终回读内容评审；原文模式逐段核对指定标题、内容和顺序。仅在现有 Skill 的明确条件触发时独立评审，不常设额外 Step。
      失败时先把精确 Rem ID、失败项和修复范围记录到 progress Evidence，再选择最早受影响层：分类回第一步、卡片回第二步、Wiki/引用回第三步；临时读取失败则本步重试。
      全部适用项通过才上报 result_verified=passed 并 terminal；交付日期、新建/更新/跳过数量、HOME 分类、卡片/Wiki ID 与校验结论。
      从已有工具记录统计内容整理、连接/读取、写入、Wiki、最终校验和环境等待；标明材料模式及规模，不将固定卡数或统一分钟数作为成功条件。
      无新增卡片也要检查本批次创建的分类、实质更新的 Wiki 和受影响引用，不能用空卡片列表代替验证。
    skills:
      - {id: remnote-verify, prompt: 对最终卡片和 Wiki 执行所有适用质量与结构检查。, optional: false}
      - {id: remnote-cli, prompt: 按精确 ID 回读真实状态，不把超时或截断当通过。, optional: false}

  terms_referenced_condition:
    prompt: |
      识别本批次卡片答案和受影响 Wiki 正文中的术语，按当前步骤绑定的 remnote-wiki 解析规范页面与 aliases，在正文术语处补原生 Rem 引用；已有有效引用直接复用。
      回读确认全部适用术语均已正确引用，复用 wiki_links_updated 的 reference_pairs 和不适用项原因作为证据；漏链、错链、字面伪链接、目标歧义或结果不明不得上报 passed。
      原文模式或没有适用术语时按既有 Skill 记录不适用原因；不为凑引用建页，未消歧目标不是不适用项，缺陷沿现有 Route 回流或报告 blocked。
    skills: []

  record_condition:
    prompt: |
      仅提交当前 Step 已真实完成的原子事实。object 字段按该 Step Prompt 填写；enum 使用声明值。
      所有回执引用真实 Rem ID。Runtime 仅检查输出类型与路由，业务事实由 Agent 按 Skill 回读核验。
      连接失败、权限不足、目标歧义、缺少授权或读取不完整时报告 blocked，不提交成功 Condition。
    skills: []

  repair_loop:
    prompt: |
      选择最早失败的一层，先记录精确 ID 和失败项再回流；后续步骤重新执行适用检查。
      回流会使下游 Output 失效，恢复时从先前 progress Evidence 取得 ID 并核验真实对象，不能仅依赖已失效回执。
      只修复本批次原对象，查重后复用已创建的 Tag、主题、卡片和 Wiki 页面；保留 ID、位置和复习记录，不整批重建或自动删除。
      结果无法确认或同一问题连续三轮仍失败时报告 blocked，保留已写入对象并说明剩余问题。
    skills: []
