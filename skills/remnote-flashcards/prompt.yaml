schema_version: 2
prompts:
  panorama_delivery_condition:
    prompt: |
      每次进入 Step（包括回流重入）先执行绑定 Skill，展示 renderer 生成的最新 Panorama，再执行业务 Prompt。
      只有已把本次 data.content 原样发到用户可见通道的父 Agent 或当前宿主，才在展示成功后保留本次精确 panorama_snapshot_path，与业务 Condition 一同上报；同一次 Step 内不重复展示。headless 子 Agent 不上报。
      渲染或展示失败、结果不明时报告 blocked，不提交成功 Condition 或选择 Route。
      local_agent 与无用户可见消息通道的 headless worker：report blocked if no user-visible channel; never write artifacts/panorama-* as delivery.
      进度或 evidence 不得使用 content saved artifacts/panorama- 或 saved to artifacts 作为已展示证明。
      父 Agent 能发用户可见消息并把本 Step 交给 headless 子 Agent 时：
      The child must not submit panorama_presented.
      After non-dry-run fanloop card render --view panorama --format markdown, the child stops and returns data.content and data.snapshot_path to the parent; report blocked if render fails.
      The parent sends the exact data.content as the first user-visible message for that Step, then reports panorama_presented with that same snapshot_path, then continues the Step business Prompt.
      Never run a panorama-gated Workflow fully headless in a child that cannot post user-visible messages.
      公开 CLI 不证明用户看见了消息。进入 Step 时的全景图不是 Workflow 完成后的投递。
      after a successful terminal Route, render panorama once more and deliver exact data.content; the in-step retrospect panorama is not the Done 100% delivery.
    skills:
      - {id: workflow-panorama, prompt: "The child must not submit panorama_presented. After non-dry-run fanloop card render --view panorama --format markdown, the child stops and returns data.content and data.snapshot_path to the parent; report blocked if render fails. The parent sends the exact data.content as the first user-visible message for that Step, then reports panorama_presented with that same snapshot_path, then continues the Step business Prompt. Never run a panorama-gated Workflow fully headless in a child that cannot post user-visible messages. 无用户可见通道则 blocked，不得把写入 artifacts/panorama-* 当作投递。", optional: false}

  resolve_home_tag_flow:
    prompt: |
      先执行 panorama_presented 的 Prompt/Skill，展示成功后再执行业务。复用对话中的理解和材料，不重新访谈。
      只处理已授权制卡。材料是 spec 或策略规格说明书，且用户没有明确要求为它制卡时，报告 blocked，不提交 home_tag_ready，不进入术语检索。
      恢复来源、内容模式、精确 KB、学习目标、已有卡片及术语清单，集中读取后交给后续步骤。默认路径是搜或添加术语闪卡，再在组合卡里引用标题卡。不启动 Wiki。
      按 remnote-flashcards 的增量规则读取原生复习证据；不可用标 unavailable，不推断掌握程度。每个术语先 `search --cards-only` 找同一记忆目标的术语闪卡；命中且够用则记录标题卡 Rem ID 供复用，不新建。Wiki 概念页和空 cards 不是术语闪卡。用户说该来源旧卡要重做时，不把那些卡记入复用。
      按 remnote-structure 定位唯一 HOME 及最细 Concept Tag。持续课程用教程名，例如「人人都是量化交易员」，不用作者名，例如「刑无刀」。不把粗 Folder 或 Wiki 页当 Tag。记录从 HOME 到叶子的祖先路径。叶子必须是 Concept。
      含中日韩文字的 search 返回空，不是缺失证明。先做已知术语对照搜索。已知术语对照搜索返回空时，先点桌面按钮「重新加载搜索缓存」，再重搜。Also search the English form of the term when it has one. 空的中文 search 不是创建 Concept 的同意。
      叶子 Concept 已经存在：tag_approved 报 passed，approval 为 not_needed，created_tag_ids 为空。叶子还不存在：向用户提出从 HOME 到叶子的完整祖先路径和 Concept 名称，等用户明确同意。同意之后才 `remnote-cli create --title "<Concept 名称>" --parent-id <父级 ID>`，再 `remnote-cli sdk rem object-set-type --target-id <新 Rem ID> --args-json '[1]'`，read 回读 remType=concept。每次 shell 一个命令。不得并行，并行会报 CLI port occupied。未同意不得报 tag_approved，也不得预览。
      单篇文章或单章记下 source_h1，必须是文章原 H1 的逐字文本。theme_title 是 `YYYY-MM-DD <来源类型> <source_h1>`。theme_para maps 00-NOTE to note, 01-PROJECTS to project, 02-AREAS to area, 03-RESOURCES to resource, and 04-ARCHIVE to archive. 教程 Tag 在 03-RESOURCES 下时，H1「前言」的主题是 `2026-10-06 resource 前言`。历史事故字符串 `2026-10-06 book 前言` 只保留为记录，不得当作当前主题。不得改写成「术语与方法」。
      离开本步的正常 Route 同时要求 home_tag_ready 与 tag_approved=passed。home_tag_ready 包含 home_id、tag_id、ancestor_ids、tag_ancestor_path、created_tag_ids、source_refs、material_digest、mode、goal_keys、existing_card_ids、term_keys、term_scope、source_h1。不是单篇时 source_h1 为 n/a。
      ID 来自当前连接，材料摘要绑定本次来源及范围；模式、学习目标和术语清单交接使用临时材料，Output 不存知识正文。
      后续临时草稿丢失时从来源和真实 Rem 恢复，重审发生变化的内容，不把旧摘要当正文。
      全程按 remnote-cli 使用 context 集中读取已知 ID。使用 RemNote Direct，不改走 MCP，也不在本 Workflow 外手写创建。每次部分成功将 ID、动作、哈希、计数和检查结论记入 progress Evidence。
      缺来源、权限、范围歧义或工具故障则 blocked；维护另开任务，不在制卡中升级工具。草稿与传输材料用后清理。
    skills:
      - {id: remnote-structure, prompt: 定位最细 HOME Concept，回读类型和父级。课程用教程名，不用作者名。, optional: false}
      - {id: remnote-flashcards, prompt: 复用材料并按学习目标查重。spec 未获授权则停止。, optional: false}
      - {id: remnote-cli, prompt: 用 Direct CLI 核对身份权限并集中读取，保留真实 ID。, optional: false}

  prepare_cards_and_wiki_flow:
    prompt: |
      先执行 panorama_presented。主 Agent 按 remnote-flashcards 和同包 references/learning-card-contract.md 写草稿。契约是普通学习卡规则的唯一清单。本步不写卡，不调用 wiki apply，不派 Wiki 助手。
      默认路径按顺序做完：列出术语；先做已知术语对照搜索，再对每个术语 `remnote-cli search "<query>" --cards-only`，并在术语有英文形式时另搜英文；够用的术语闪卡复用其标题 Rem ID；没有才起草短标题原子卡，长问句只作为该卡的别名计划；原子卡都有归宿之后才起草组合卡。组合卡的引用只指向这些标题卡，草稿里用 term_key 占位，不得指向别名 Rem、Wiki 页、pageKey 或字面括号。
      对照搜索返回空时按 control_search_condition 处理，不得把空的中文 search 记成 miss。已知术语对照搜索返回空时，先点桌面按钮「重新加载搜索缓存」，再重搜。Also search the English form of the term when it has one.
      remnote-wiki 在本步是可选绑定。只有用户本批明确要求维护 Wiki 时才读取并执行它。默认批次不得执行。Wiki 工作不满足 terms_ready，也不能代替标题卡 rem-ref。用户要求了 Wiki 但写入未完成时报告 blocked，不要用术语回执掩盖。
      共用准备阶段的来源、学习目标、模式和术语清单。
      主 Agent 每完成一个草稿批次立即交给独立只读审卡助手；按 remnote-verify 和学习卡契约审查。按批审，不为每张卡派助手。审卡回执对每张普通卡给出 kid_clarity 五问，值只能是 yes 或 no；对每张组合卡逐字列出四条 star_headings。
      审卡助手只能读材料与草稿、返回覆盖卡号及失败原因，不能修改卡或 Wiki。
      草稿失败只修失败卡，再由审卡助手复审改动部分。标题卡引用错误走 term_refs_need_fix，回本步重排原子卡和引用，不在写入步发明 ID。
      审卡结束后记录 preparation_recorded：material_digest、draft_digest、card_keys、term_pipeline、source_h1、theme_title、preflight、reviewer_receipt（覆盖 card_keys、失败、来源、摘要、kid_clarity、star_headings）、term_keys、skipped_count。不要写 wiki_receipt，不要写「用户未要求 Wiki」来前进。
      term_pipeline 每个术语一条：query、cards_only: true、outcome 为 reuse 或 create。reuse 带 title_rem_id。create 带 miss 和 term_key，title_rem_id 在写入前为 pending。组合卡另列 rem_refs，只含 title_rem_id 或本批 term_key。
      source_h1 与 theme_title 按契约成对填写。单篇或单章时 theme_title 必须等于 `YYYY-MM-DD <来源类型> <source_h1>`，来源类型按 theme_para 对齐 Tag 所在 PARA 区。theme_para maps 00-NOTE to note, 01-PROJECTS to project, 02-AREAS to area, 03-RESOURCES to resource, and 04-ARCHIVE to archive. 对不上就不要把 theme_literal 或 theme_para 写成 pass。
      preflight 的形状和门禁 id 以契约为准，draft_digest 必须与本回执相同。任一 fail 不得报 learning_preflight_passed。
      reviewer_receipt 覆盖的 card_keys 必须与 preparation_receipt.card_keys 逐项相同，且失败项为空，才允许 draft_quality_passed。
      离开本步的正常 Route 同时要求 preparation_recorded、draft_quality_passed、terms_ready=passed、learning_preflight_passed=passed、control_search_passed=passed。五者缺一不得进入写入。
      全部重复允许零新卡，仍要有每个术语的 search 证据和复用标题卡 ID。原文导入或原文摘录不建术语卡；terms_ready 只接受 mode 为 original_import 或 original_excerpt、term_pipeline.action 为 skip_original、且没有术语创建和 Wiki 调用。这不是 Wiki 豁免。
      分类错误回第一步。同问题连续三轮失败或结果不明 blocked，不编造通过回执。
    skills:
      - {id: remnote-flashcards, prompt: 只起草。先搜术语再排原子卡，再排引用标题卡的组合卡。本步不写卡。, optional: false}
      - {id: remnote-verify, prompt: 独立只读评审当前草稿批次，输出覆盖、kid_clarity 五问、组合卡逐字 STAR 标题和失败项。, optional: false}
      - {id: remnote-wiki, prompt: 默认路径不得执行。仅当用户本批明确要求维护 Wiki 时才读取；该工作不满足 terms_ready。, optional: true}
      - {id: remnote-cli, prompt: 术语搜索必须带 --cards-only。不调用 wiki apply。未知写入先核对。, optional: false}

  persist_and_verify_flow:
    prompt: |
      先执行 panorama_presented。核对当前有效 preparation_receipt、draft_quality_passed、terms_ready、learning_preflight_passed。material_digest 与 draft_digest 必须与当前材料和最新草稿一致。缺回执、摘要不一致、term_pipeline 不覆盖本批术语、reviewer 覆盖的 card_keys 不等于 card_keys、失败项非空、preflight 缺失或与当前 draft_digest 不一致、任一门禁不是 pass，都不得写卡，回准备步骤修复。source_h1 与 theme_title 按契约重算；不一致就阻塞。
      默认路径不注入 Wiki 页面 ID，不等待 Wiki 助手，不调用 wiki apply。
      每次 shell 只跑一个 remnote-cli。不得并行，并行会报 CLI port occupied。今日笔记先只读查找。`sdk date get-todays-doc` 是写入，笔记不存在时会创建。只读阶段不得调用。
      计划没有字段可以指定已经存在的主题。术语卡计划写 title，用已经对上的 theme_title。已经有 Rem ID 的标题卡可以写进组合卡答案。本批新建的标题卡等术语卡 apply 回读 ID 之后，组合卡再单独一次 flashcards apply，计划不写 title。第二份带 title 的计划会再造一个主题。
      别名在标题卡已经存在之后再加。每张标题卡一条：`remnote-cli sdk rem object-get-or-create-alias-with-text --target-id <ID> --args-json '[["<alias>"]]'`。`update --add-aliases` 取决于 SDK 版本。SDK 0.0.46 失败，错误是 `Native transactions are unavailable: SDK 0.0.46 cannot acknowledge abort`。
      组合卡必须放在主题 Rem 里面，排在术语卡之后，是最后一个子 Rem，自己不挂 Tag。组合卡 apply 之后父级还是每日笔记。先干跑 `remnote-cli move-note <COMBO_ID> --new-parent-rem-id <THEME_ID> --position last --expected-old-parent-rem-id <DAILY_ID>`，对照后再另一次调用加上 `--apply`。然后 `remnote-cli sdk rem object-remove-tag --target-id <COMBO_ID> --args-json '["<TAG_ID>", false]' --allow-destructive`。`update-tags --remove-tag-ids` 会失败，它要求 allowDestructive。不要把组合卡留在每日笔记上。
      回读：主题子 Rem 顺序是术语卡在前、组合卡为最后一个；组合卡没有 tags；`review-stats --root-id <THEME_ID>` 列出本批全部卡片；`search-by-tag` 只返回主题。没有组合卡时 combo_placed 记 no_combo。没有新标题卡时 aliases_written 记 no_new_aliases。
      已经复用的标题卡不新建。不得引用别名 Rem。界面应显示短名，例如 [[PE]]，点击打开带背面的标题卡。
      combo rem-refs use flashcards apply TextSegments {"remId":"..."} or object-set-text RichText {"i":"q","_id":"..."}; do not use create --content-file with [[id:]].
      2026-10-07 失败例：`create --content-file` 中的 `[[id:gTpsZTEYvBxB4S1PM]]`（分批加仓）把 T 正文写成 `[[DCF]]0`。不得再走这条。
      预览不加 `--apply` 时，输出只有 `validated` 和 `planHash`，没有卡片正文。`--apply` 之前读完计划文件，对照已审草稿的 digest。格式、计划预算、身份权限和前置哈希通过，并且学习预检在这次阅读之后仍全部 pass，才另一次调用加上 `--apply`。
      离开本步的正常 Route 同时要求 flashcards_written、terms_referenced=passed、result_verified=passed、learning_preflight_passed=passed、combo_placed=passed、aliases_written=passed。
      每批最多 7 张新卡且计划最多 100 KiB。用户没有要求 Wiki 时不要为了凑满 10 个 Wiki 页而建页。按学习链路和引用依赖分批，不截断原文或扩大上限。
      新卡按真实创建日期置于每日笔记。单卡挂最细 HOME Concept Tag。多卡可以放在一个普通 text 主题 Rem 下，只给主题挂该 Tag，子卡不重复打标。主题标题用 preparation 里已经对上的 theme_title。更新保留原位置、Rem ID、cardId 和复习记录。
      --apply 之前再扫一遍普通学习卡的正面和答案行。arrow_hits 必须为 0。
      cardCluster 只按学习卡契约：用户没要求就省略或写 false；用户明确要求，且有主题标题、新卡至少 2 张，才写 true。不要调用 object-add-powerup 补 cc。意外的 true 是 remnote-direct 回归，回本步 verification_retry，不要记成成功。
      写后对每个多卡主题运行 object-has-powerup ["cc"]，把结果写入 flashcards_written 的 cluster_powerup。组合卡实际引用的 remId 必须等于 term_pipeline 里的标题卡 Rem ID。集中回读实际正文、父级、Tag、引用及复习身份，与已审草稿逐项比对；正文改变必须独立重审。
      用写后回读重新提交 learning_preflight_passed。只复述准备阶段的 pass 不得报 passed。
      按 remnote-verify 复用未失效检查，仅重查受影响项。本次没有 Wiki 修改时，不跑 WIKI 零卡片扫描，也不把缺少 Wiki 引用判失败。用户明确要求且本批确实改过 Wiki 时，才在最后一次相关修改后做完整零卡片证明。
      flashcards_written 包含 created_rem_ids、updated_rem_ids、reused_rem_ids、card_ids、topic_ids、daily_rem_ids、tag_id、source_refs、skipped_count、reference_pairs、batch_ids、review_receipt、verification_receipts、cluster_powerup。reference_pairs 的目标是标题卡 Rem ID。cluster_powerup 取 object-has-powerup ["cc"] 的 true 或 false；没有多卡主题时写 not_applicable。
      标题卡引用回读通过才报 terms_referenced=passed。内容、结构、预检和标题卡引用都通过才报 result_verified=passed。零新卡仍核对复用对象和分类。
      标题卡引用错误回准备步骤，repair_scope 用 term_refs。分类错误回定位。临时读失败本步重试。
      写后回流先恢复 progress Evidence 的真实 ID，查明未知结果才继续缺失动作；不换键重放、不整批重建。
    skills:
      - {id: remnote-flashcards, prompt: 术语卡计划写 title。组合卡计划不写 title。apply 之后 move-note 再 object-remove-tag。默认不写 Wiki。, optional: false}
      - {id: remnote-verify, prompt: 比对已审草稿及实际正文。组合卡是主题最后一个子 Rem 且没有 tags。标题卡引用、主题、Tag 和 cc 按契约回读。没有 Wiki 修改时不扫 WIKI。, optional: false}
      - {id: remnote-cli, prompt: 每次 shell 一个命令。别名用 object-get-or-create-alias-with-text。预览只看 validated 和 planHash，对照计划文件后再 --apply。, optional: false}

  retrospect_run_flow:
    prompt: |
      先执行 panorama_presented。确认 result_verified=passed 及最终回执仍有效，不进行新的知识写入，不补 Wiki 日志。
      只读取已有运行记录，统计内容准备、独立审卡、工具读写、完整扫描、返工和等待；保留总 wall time，重叠时间不相加，无法区分明确为 unknown。
      允许零发现，最多选一个有证据、可复用的通用问题，固定记录：证据、重复机制、建议改动、验证方法。retrospective 同时带 this_run_violations：本轮曾经失败的学习卡契约门禁 id，没有则为空列表。
      若用户未要求集群而 cluster_powerup 为 true，这条就是本轮唯一发现。证据是主题 Rem ID 和 object-has-powerup ["cc"] 的结果。机制是 remnote-direct 的 flashcards apply 回归：省略或 false 不得添加 cc。建议改动指向 remnote-direct。验证方法是同一查询回到 false。这份发现表示内容证据已失效，回到写入步骤处理，不能用复盘终止 Route 把 true 收成成功。
      retrospective_recorded 包含 timing、full_scan_count、rework_count、this_run_violations、findings（0..1）、notion_sync。摘要追加到当前 progress Evidence/运行记录。
      有 finding 时，先读绑定配置源里的 skills/remnote-flashcards/skills/remnote-flashcards/references/notion-experience.md，再用官方 Notion CLI `ntn` 为这一条创建「remnote workflow 经验表」的一行。不要另建维护平台，不要另写一套数据库 ID。
      FANLOOP_REMN_EXPERIENCE_DATA_SOURCE_ID overrides the data source id; FANLOOP_REMN_EXPERIENCE_DATABASE_ID overrides the database id. Defaults live in references/notion-experience.md.
      Auth is ntn login; headless hosts set NOTION_KEYRING=0. Do not require an integration API key.
      Map 经验 to the one-line lesson, 日期 to the ISO run date, 主题 to the RemNote theme title, 类别 to 文案清晰度|工具链路|流程门禁|其他, 详情 to evidence + mechanism + suggested change + verification, and 编码状态 to 待编码 unless the finding already points at a merged fix (已编码) or is a non-code lesson (不适用).
      When findings is non-empty, POST one page per finding with ntn api v1/pages to data source 「remnote workflow 经验表」; zero findings skip the write; a failed ntn call records notion_sync and still allows retrospective_recorded.
      复盘只记录建议，不现场修改 Workflow、验收条件或升级 CLI。后续独立维护验证后才供下一任务使用。
      交付真实日期、创建/更新/复用/跳过数量、分类、标题卡与组合卡 ID、验证范围和未实测项。默认交付不列 Wiki 页面。不用固定分钟数承诺提速。
      若发现实际内容证据已失效则回对应步骤处理，不能用复盘终止 Route 绕过失败。
      终止 Route 被接受、Workflow 为 completed 之后，不要停在进入本步时的全景图。父宿主再执行一次非 dry-run `fanloop card render --view panorama --format markdown`，把该次精确 `data.content` 原样作为用户可见消息送出。那一次是 Done 与 100%。没有用户可见通道则 blocked。不得把写入文件当成这次投递。公开 CLI 不证明用户看见了消息。
      after a successful terminal Route, render panorama once more and deliver exact data.content; the in-step retrospect panorama is not the Done 100% delivery.
    skills:
      - {id: remnote-cli, prompt: 读取已有回执及范围，不额外修改知识对象。, optional: false}

  draft_quality_condition:
    prompt: |
      核对独立只读审卡助手的覆盖集合等于当前草稿批次，失败项为空；来源、mode、material_digest 和 draft_digest 与 preparation_receipt 一致。
      reviewer_receipt 对每张普通卡有 kid_clarity，恰好五个键 one_goal、one_pass、concrete、plain_words、no_arrow，值只能是 yes 或 no，且全部为 yes。每张组合卡有 star_headings，四条与学习卡契约逐字相同：`S — Situation：背景`、`T — Task：任务／目标`、`A — Action：行动`、`R — Result：结果`。
      学习卡契约「失败条件」里任一条成立，不得报 passed。那些条件的通过与否同时由 learning_preflight_passed 挡住 Route；本 Condition 不接受作者自证，也不接受缺五问或任一为 no。
      组合卡的问题和 S、T、A、R 不得使用未解释的成人交易黑话。出现则 one_pass 与 plain_words 为 no，不得报 passed。combo plain_words rejects unexplained trading slang: 梭哈, 全仓, 一把梭, 优秀个股; rewrite with plain kid words such as 一次花光 or 分开买.
      原文导入和原文摘录逐段保真，不套契约的费曼或 STAR，也不因短标题、别名、STAR、箭头、原子卡顺序或 kid_clarity 失败。零新卡仍覆盖实际更新及复用决定。
      能派子 Agent 时，派一个不继承起草上下文的只读审卡。这个宿主派不出子 Agent 时，请父级或宿主跑这次只读审卡。没有这样的父级时，请用户审，回执记 reviewer=user。作者自证不得报 passed。
      未审、旧稿回执、覆盖缺失或失败不得报 passed。只复审改变的卡，对照重新计算的 draft_digest；保留未失效的已审部分。
      reviewer_receipt 记录 plugin_commit：Fanloop 运行记 skills/remnote-flashcards 源的 git commit；插件运行记插件 git commit。
      example numbers state their condition, such as when idle; do not use a platform term as an everyday word, such as 小程序 on a WeChat card; a binary question's answer line states the choice.
      这条是 factual_review，不是 kid_clarity 的第六个键。五问键仍然恰好是 one_goal、one_pass、concrete、plain_words、no_arrow。
    skills: []

  terms_ready_condition:
    prompt: |
      本 Condition 取代原来的 wiki_ready。普通学习批次不得用 Wiki 不适用、空映射或「用户未要求 Wiki」报 passed。缺少 Wiki 页面不是本门禁的对象，也不是通过理由。
      普通学习：preparation_receipt.term_pipeline 覆盖本批每一个术语。每条含 query、cards_only: true，outcome 为 reuse 或 create。reuse 的 title_rem_id 来自 `search --cards-only` 命中的术语闪卡标题 Rem，不是别名 Rem，不是 Wiki 页，不是空 cards。create 必须有同一记忆目标的 miss，标题是短名，长句只计划为该标题卡的别名。组合卡 rem_refs 只含这些 title_rem_id，或指向本批将先创建的原子卡 term_key。别名 Rem、pageKey、字面括号、编造 ID 和 Wiki 页面 ID 都不得报 passed。
      材料里有可复用概念时，空 term_pipeline 不得报 passed。全部复用仍要有搜索证据和标题卡 ID。
      原文导入或原文摘录：仅当 mode 为 original_import 或 original_excerpt，term_pipeline.action 为 skip_original，term_creates 为 0，wiki_calls 为 0 时才报 passed。
      用户另行要求 Wiki 时，Wiki 是否写完不改变本 Condition。Wiki 未完成另报 blocked。
    skills: []

  learning_preflight_condition:
    prompt: |
      本 Condition 是 Route 门禁。判定以学习卡契约的 preflight 和「失败条件」为准。任一 fail、缺对象、摘要不一致或结果不明，不得报 passed。
      准备步骤：preflight.draft_digest 等于当前 draft_digest，每个门禁都是 pass，arrow_hits 为 0。门禁 id 是 term_search、atomics_first、short_titles、aliases_after_create、rem_ref_title_ids、star_labels_exact、arrow_scan、theme_literal、theme_para、tag_path、tag_approval、control_search、no_spec_unless_asked、card_cluster、named_methods、redo_reuse、combo_placement、alias_method、factual_review。kid_clarity 五问任一为 no 也不得报 passed。组合卡问题或 S、T、A、R 里的未解释交易黑话使 plain_words 与 one_pass 为 no。combo plain_words rejects unexplained trading slang: 梭哈, 全仓, 一把梭, 优秀个股; rewrite with plain kid words such as 一次花光 or 分开买.
      theme_literal：单篇或单章的 theme_title 必须是 `YYYY-MM-DD <来源类型> <source_h1>`，source_h1 是原 H1。H1 保持逐字。写成「术语与方法」失败。
      theme_para：来源类型必须等于 Tag 所在 PARA 区。theme_para maps 00-NOTE to note, 01-PROJECTS to project, 02-AREAS to area, 03-RESOURCES to resource, and 04-ARCHIVE to archive. 教程 Tag 在 03-RESOURCES 下时，前言主题是 `2026-10-06 resource 前言`。历史字符串 `2026-10-06 book 前言` 不是当前主题。
      tag_path：叶子是教程或课程 Concept，例如「人人都是量化交易员」。作者名，例如「刑无刀」，或只停在粗 Folder，失败。
      tag_approval：叶子已存在则 not_needed 且 created_tag_ids 为空；缺失则须有用户明确同意、`create --title "<Concept 名称>" --parent-id` 和回读 remType=concept。空的中文 search 不是同意。
      control_search：已知术语对照搜索先于把空的中文 search 当成 miss。已知术语对照搜索返回空时，先点桌面按钮「重新加载搜索缓存」，再重搜。Also search the English form of the term when it has one.
      combo_placement：有组合卡时，写后它是主题最后一个子 Rem 且没有自己的 Tag。没有组合卡时记 no_combo 仍可 pass。
      alias_method：新标题卡的别名用 `sdk rem object-get-or-create-alias-with-text --target-id <ID> --args-json '[["<alias>"]]'`。没有新别名时记 no_new_aliases 仍可 pass。
      factual_review：example numbers state their condition, such as when idle; do not use a platform term as an everyday word, such as 小程序 on a WeChat card; a binary question's answer line states the choice. 这不是 kid_clarity 的第六个键。
      no_spec_unless_asked：用户未要求时出现 spec 或策略规格说明书卡，失败。
      card_cluster：用户未要求时计划不得为 true。写后意外的 cc true 失败。
      写入步骤用写后回读重新判定主题、Tag、标题卡 remId、别名落点、箭头和 cc。只复述准备阶段的 pass 不得报 passed。
      原文模式不套儿童口吻和 STAR，card_cluster 与 no_spec_unless_asked 仍然适用。
      主题或 Tag 失败用 home_tag。草稿正文失败用 flashcards。标题卡引用失败用 term_refs。写后结构失败用 verification。
    skills: []

  terms_referenced_condition:
    prompt: |
      回读组合卡答案里的原生引用。每个引用的 Rem ID 必须等于本批 term_pipeline 的标题卡 Rem ID，回读标题是短名，点击目标带该卡的背面子 Rem。别名 Rem、Wiki 页面、pageKey、字面 [[名称]] 或无法解析的 ID 不得报 passed。
      没有组合卡时，核对没有把术语引用到别名 Rem 或 Wiki 页，并记下 no_combo_refs。这不是 Wiki 不适用回执。
      引用不能替代卡内作答所需的解释。原文模式没有术语引用时，仅当 terms_ready 的 skip_original 仍有效才报 passed。
      漏引用、错引用或结果不明不得报 passed，repair_scope 用 term_refs。
    skills: []

  tag_approval_condition:
    prompt: |
      叶子 Concept 已存在：报 passed，approval 为 not_needed，created_tag_ids 为空。
      叶子不存在：提出从 HOME 到该 Concept 的完整祖先路径，等用户明确同意。空的中文 search 不是同意，也不是缺失证明。已知术语对照搜索返回空时，先点桌面按钮「重新加载搜索缓存」，再重搜。Also search the English form of the term when it has one.
      同意之后才 `remnote-cli create --title "<Concept 名称>" --parent-id <父级 ID>`，然后 `remnote-cli sdk rem object-set-type --target-id <新 Rem ID> --args-json '[1]'`，read 回读 remType=concept。每次 shell 一个命令。不得并行，并行会报 CLI port occupied。
      未同意、未回读或类型不是 concept，不得报 passed。
      theme_para maps 00-NOTE to note, 01-PROJECTS to project, 02-AREAS to area, 03-RESOURCES to resource, and 04-ARCHIVE to archive.
      主题来源类型必须等于这个 Tag 所在的 PARA 区。教程在 03-RESOURCES 下时，前言主题是 `2026-10-06 resource 前言`。历史事故字符串 `2026-10-06 book 前言` 只保留为记录。
    skills: []

  control_search_condition:
    prompt: |
      空的中日韩 search 没有权威性。先用一个已知存在的术语做对照搜索。已知术语对照搜索返回空时，先点桌面按钮「重新加载搜索缓存」，再重搜。Also search the English form of the term when it has one.
      对照搜索有结果之后，才用同一缓存状态重搜本批术语。对照仍为空，且宿主没有 Computer Use 时，报告 blocked，请用户自己点该按钮。不得把空的中文 search 记成 miss，也不得据此新建卡或 Tag。
      这个按钮是日常路径上唯一的非 CLI 步骤。搜索、读取、别名、标签和写卡都用 remnote-cli。
      原文导入或原文摘录，且 terms_ready 为 skip_original 时，control_search_passed 可以带 skip_original 报 passed。普通批次必须有对照搜索证据。
      每次 shell 一个命令。不得并行，并行会报 CLI port occupied。
    skills: []

  combo_placement_condition:
    prompt: |
      没有组合卡时，combo_placed 报 passed，并记下 no_combo。
      有组合卡时，组合卡计划不写 title。flashcards apply 之后父级仍是每日笔记，并且组合卡自己带上了 Tag。不要把组合卡留在每日笔记上。
      先干跑，再另一次 shell 加 --apply。命令是 `remnote-cli move-note <COMBO_ID> --new-parent-rem-id <THEME_ID> --position last --expected-old-parent-rem-id <DAILY_ID>`。
      然后 `remnote-cli sdk rem object-remove-tag --target-id <COMBO_ID> --args-json '["<TAG_ID>", false]' --allow-destructive`。`update-tags --remove-tag-ids` 会失败，它要求 allowDestructive。
      回读：主题子 Rem 顺序是术语卡在前、组合卡为最后一个；组合卡没有 tags；`review-stats --root-id <THEME_ID>` 列出本批全部卡片；`search-by-tag` 只返回主题。
      每次 shell 只跑一个 remnote-cli。不得并行，并行会报 CLI port occupied。
      任一回读失败不得报 passed。
    skills: []

  alias_method_condition:
    prompt: |
      没有新建标题卡、也没有新别名时，aliases_written 报 passed，并记下 no_new_aliases。
      有新标题卡时，标题卡已经存在之后，每张一条：`remnote-cli sdk rem object-get-or-create-alias-with-text --target-id <ID> --args-json '[["<alias>"]]'`。
      `update --add-aliases` 取决于 SDK 版本。SDK 0.0.46 失败，错误是 `Native transactions are unavailable: SDK 0.0.46 cannot acknowledge abort`。该版本用上面的 SDK 方法。
      别名 Rem 不得当作组合卡引用目标。每次 shell 一个命令。不得并行，并行会报 CLI port occupied。
    skills: []

  record_condition:
    prompt: |
      仅提交当前 Step 已真实完成的事实；object 字段按当前 Prompt 填写，enum 使用声明值。
      Runtime 只检查类型和路由，业务事实、证据覆盖和新鲜度由 Agent 按 Skill 验证。不得用哈希或合成回执冒充真实质量检查。
      连接失败、权限不足、目标歧义、未授权或读取不完整报告 blocked，不提交成功 Condition。
    skills: []

  repair_loop:
    prompt: |
      记录精确 ID、失败项和范围后回最早失败层；批内可修缺陷就地处理，仅重查受影响项。
      主题标题、来源类型或 Concept Tag 错误用 home_tag，回到 resolve_home_tag。草稿正文、STAR、箭头、儿童口吻或 factual_review 错误用 flashcards，回到 prepare_cards_and_wiki。标题卡 rem-ref、别名方法或漏掉的术语搜索、对照搜索用 term_refs，回到 prepare_cards_and_wiki。写后 cc、组合卡父级、组合卡自己的 Tag 或回读不一致用 verification，回到 persist_and_verify。
      回流使下游 Output 失效，先从 progress Evidence 恢复并核验原对象及批次键。准备阶段不得重复写已完成卡片。
      原位修复并保留 ID、日期、位置和复习记录；正文改变独立重审。默认不补 Wiki。只有用户本批明确要求 Wiki 且相关页面未写完时才补，并单独 blocked，不把它记成 terms_ready。
      不整批重建、不自动删除、未知写入不重放；同一问题连续三轮失败或结果不明则 blocked，说明已完成和剩余范围。
    skills: []
