schema_version: 5
flow:
  resolve_home_tag:
    - prompt_ref: {file: prompt.yaml, prompt_id: resolve_home_tag_flow}
      when: {any_of: [[home_tag_ready, panorama_presented]]}
      next_step_id: prepare_cards_and_wiki
  prepare_cards_and_wiki:
    - prompt_ref: {file: prompt.yaml, prompt_id: prepare_cards_and_wiki_flow}
      when: {any_of: [[preparation_recorded, draft_quality_passed, wiki_ready, panorama_presented]]}
      next_step_id: persist_and_verify
  persist_and_verify:
    - prompt_ref: {file: prompt.yaml, prompt_id: persist_and_verify_flow}
      when: {any_of: [[flashcards_written, terms_referenced, result_verified, panorama_presented]]}
      next_step_id: retrospect_run
  retrospect_run:
    - prompt_ref: {file: prompt.yaml, prompt_id: retrospect_run_flow}
      when: {any_of: [[retrospective_recorded, panorama_presented]]}
      terminal: true
