schema_version: 4

loop:
  # 加载器要求每个 Step 至少一条 Loop。已批准草案未写首步；playbook_wrong 用已有 back_to_playbook 回到自身。
  select_playbook:
    - prompt_ref: {file: prompt.yaml, prompt_id: back_to_playbook}
      when: {any_of: [[playbook_wrong]]}
      back_step_id: select_playbook

  define_acceptance:
    - prompt_ref: {file: prompt.yaml, prompt_id: back_to_playbook}
      when: {any_of: [[playbook_wrong]]}
      back_step_id: select_playbook

  design_solution:
    - prompt_ref: {file: prompt.yaml, prompt_id: back_to_acceptance}
      when: {any_of: [[acceptance_changed]]}
      back_step_id: define_acceptance
    - prompt_ref: {file: prompt.yaml, prompt_id: back_to_playbook}
      when: {any_of: [[playbook_wrong]]}
      back_step_id: select_playbook

  implement_increments:
    - prompt_ref: {file: prompt.yaml, prompt_id: back_to_acceptance}
      when: {any_of: [[acceptance_changed]]}
      back_step_id: define_acceptance
    - prompt_ref: {file: prompt.yaml, prompt_id: back_to_design}
      when: {any_of: [[design_inadequate]]}
      back_step_id: design_solution
    - prompt_ref: {file: prompt.yaml, prompt_id: back_to_implement}
      when: {any_of: [[increment_failed]]}
      back_step_id: implement_increments

  verify_behavior:
    - prompt_ref: {file: prompt.yaml, prompt_id: back_to_implement}
      when: {any_of: [[verification_failed], [increment_failed]]}
      back_step_id: implement_increments
    - prompt_ref: {file: prompt.yaml, prompt_id: back_to_acceptance}
      when: {any_of: [[acceptance_changed]]}
      back_step_id: define_acceptance
    - prompt_ref: {file: prompt.yaml, prompt_id: back_to_design}
      when: {any_of: [[design_inadequate]]}
      back_step_id: design_solution

  merge_and_release:
    - prompt_ref: {file: prompt.yaml, prompt_id: back_to_implement}
      when: {any_of: [[remote_product_checks_failed], [post_merge_smoke_failed]]}
      back_step_id: implement_increments
    - prompt_ref: {file: prompt.yaml, prompt_id: back_to_acceptance}
      when: {any_of: [[acceptance_changed]]}
      back_step_id: define_acceptance
