schema_version: 7
id: remnote-direct-maintainer
stages:
  - id: define
    name: Define
    jobs:
      - id: define
        name: 范围与契约
        steps:
          - {id: define_change, name: 确定影响与验收, executor: agent}
  - id: build
    name: Build
    jobs:
      - id: build
        name: 候选构建
        steps:
          - {id: build_candidate, name: 修改与冻结候选, executor: agent}
  - id: verify
    name: Verify
    jobs:
      - id: verify
        name: 按影响验收
        steps:
          - {id: verify_candidate, name: 验证真实行为, executor: agent}
  - id: deliver
    name: Deliver
    jobs:
      - id: deliver
        name: 交付与接管
        steps:
          - {id: deliver_change, name: 推送与本地接管, executor: agent}
