schema_version: 3
conditions:
  panorama_presented:
    prompt_ref: {file: prompt.yaml, prompt_id: panorama_condition}
    output: {key: panorama_snapshot_path, type: path}
  change_defined:
    prompt_ref: {file: prompt.yaml, prompt_id: record_condition}
    output: {key: change_scope, type: object}
    exclusive_group: step_outcome
  candidate_built:
    prompt_ref: {file: prompt.yaml, prompt_id: record_condition}
    output: {key: candidate, type: object}
    exclusive_group: step_outcome
  candidate_verified:
    prompt_ref: {file: prompt.yaml, prompt_id: record_condition}
    output: {key: acceptance, type: object}
    exclusive_group: step_outcome
  change_delivered:
    prompt_ref: {file: prompt.yaml, prompt_id: record_condition}
    output: {key: delivery, type: object}
    exclusive_group: step_outcome
  scope_needs_fix:
    prompt_ref: {file: prompt.yaml, prompt_id: record_condition}
    output: {key: repair_scope, type: enum_value, values: [scope]}
    exclusive_group: step_outcome
  build_needs_fix:
    prompt_ref: {file: prompt.yaml, prompt_id: record_condition}
    output: {key: repair_scope, type: enum_value, values: [build]}
    exclusive_group: step_outcome
  acceptance_needs_fix:
    prompt_ref: {file: prompt.yaml, prompt_id: record_condition}
    output: {key: repair_scope, type: enum_value, values: [acceptance]}
    exclusive_group: step_outcome
  delivery_needs_fix:
    prompt_ref: {file: prompt.yaml, prompt_id: record_condition}
    output: {key: repair_scope, type: enum_value, values: [delivery]}
    exclusive_group: step_outcome
