schema_version: 1
# 生产 Trace 投影关闭（provider: none）。test profile 仍是 lark，供显式
# `trace bind --registry test` 与测试使用。下面的 url、base_token、table_id、
# view_id 是占位符，仓库不保存真实坐标。解析结果的 provider 为 lark 时，
# 非空环境变量覆盖对应占位符：
#   FANLOOP_TRACE_REGISTRY_URL
#   FANLOOP_TRACE_REGISTRY_BASE_TOKEN
#   FANLOOP_TRACE_REGISTRY_TABLE_ID
#   FANLOOP_TRACE_REGISTRY_VIEW_ID
# provider none 忽略这些变量。
profiles:
  production:
    default:
      provider: none
  test:
    default:
      provider: lark
      url: https://base.example.invalid/wiki/example-base?table=example-table-id&view=example-view-id
      base_token: example-base-token
      table_id: example-table-id
      view_id: example-view-id
      require_cli_log_document: false
      fields:
        trace_key: trace_key
        title: 需求
        owner: 负责人
        location: 阶段 / 子状态
        status: 状态
        loop_count: Loop
        source_url: PRD
        source_output: requirement_document_url
        source_document_only: true
        trace_url: Trace
        updated_at: 更新时间
        origin: 来源
