name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test distribution installer
        run: node --test packaging/npm/install.test.js scripts/verify-release-assets.test.js
      - name: Build release assets
        run: ./scripts/build-release.sh "${{ runner.temp }}/fanloop-release"
      - name: Verify release assets
        run: node ./scripts/verify-release-assets.js "${{ runner.temp }}/fanloop-release"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes "Fanloop ${GITHUB_REF_NAME#v}" \
            "${{ runner.temp }}/fanloop-release"/*
