name: Release

on:
  workflow_dispatch:

concurrency:
  group: fanloop-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install pinned Thrift generators
        run: |
          go install github.com/cloudwego/thriftgo@v0.4.3
          go install github.com/cloudwego/thrift-gen-validator@v0.2.5
      - run: ./tests/run-unit
      - run: ./tests/run-e2e
      - name: Build matched GitHub Release
        run: ./scripts/prepare-release.sh
      - name: Publish verified GitHub Release
        env:
          FANLOOP_EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          version="$(node -e 'process.stdout.write(require("./dist/release.json").release_version)')"
          tag="v$version"
          repository="${{ github.repository }}"
          old_latest="$(gh release list -R "$repository" --limit 100 --json tagName,isLatest --jq 'map(select(.isLatest))[0].tagName // ""')"

          gh release create "$tag" -R "$repository" \
            --draft \
            --target "${{ github.sha }}" \
            --title "Fanloop $version" \
            --generate-notes \
            dist/release.json \
            dist/fanloop-install.sh \
            dist/fanloop-install.js \
            dist/fanloop-launcher.sh \
            dist/fanloop-"$version"-*.tar.xz

          ./scripts/verify-github-release.sh "$version" exact
          gh release edit "$tag" -R "$repository" --draft=false --latest

          if ! ./scripts/verify-github-release.sh "$version" latest; then
            rollback_failed=0
            gh release edit "$tag" -R "$repository" --prerelease --latest=false || rollback_failed=1
            if [[ -n "$old_latest" ]]; then
              gh release edit "$old_latest" -R "$repository" --latest || rollback_failed=1
            fi
            if ! restored_latest="$(gh release list -R "$repository" --limit 100 --json tagName,isLatest --jq 'map(select(.isLatest))[0].tagName // ""')"; then
              restored_latest=""
              rollback_failed=1
            fi
            if [[ "$restored_latest" != "$old_latest" ]]; then
              rollback_failed=1
            fi
            if [[ "$rollback_failed" -ne 0 ]]; then
              echo "failed to restore GitHub Release latest from $tag to ${old_latest:-none}" >&2
            fi
            exit 1
          fi
