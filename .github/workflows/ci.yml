name: CI

on:
  pull_request:
  push:
    branches: [master]

env:
  CANDIDATE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_HEAD }}
          fetch-depth: 0
      - name: Verify candidate checkout
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_HEAD"
      - name: Classify complete diff and reject local-only materials
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_HEAD: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 .github/scripts/classify-changes.py --event "$EVENT_NAME" --base "$BASE_HEAD" --head "$CANDIDATE_HEAD"

  test:
    needs: changes
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.code != 'false')
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Require successful code classification
        env:
          CLASSIFICATION_RESULT: ${{ needs.changes.result }}
          CODE_CHANGED: ${{ needs.changes.outputs.code }}
        run: test "$CLASSIFICATION_RESULT" = success && test "$CODE_CHANGED" = true
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_HEAD }}
      - name: Verify candidate checkout
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_HEAD"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test distribution installer
        run: node --test packaging/npm/install.test.js scripts/verify-release-assets.test.js
      - name: Install pinned Thrift generators
        run: |
          go install github.com/cloudwego/thriftgo@v0.4.3
          go install github.com/cloudwego/thrift-gen-validator@v0.2.5
      - run: ./tests/run-unit

  requirement-e2e:
    needs: changes
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.code != 'false')
    runs-on: ubuntu-latest
    steps:
      - name: Require successful code classification
        env:
          CLASSIFICATION_RESULT: ${{ needs.changes.result }}
          CODE_CHANGED: ${{ needs.changes.outputs.code }}
        run: test "$CLASSIFICATION_RESULT" = success && test "$CODE_CHANGED" = true
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_HEAD }}
      - name: Verify candidate checkout
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_HEAD"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run Requirement E2E and Route Matrix
        run: ./.github/scripts/run-requirement-validation

  install-doctor:
    needs: changes
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.code != 'false')
    runs-on: ubuntu-latest
    steps:
      - name: Require successful code classification
        env:
          CLASSIFICATION_RESULT: ${{ needs.changes.result }}
          CODE_CHANGED: ${{ needs.changes.outputs.code }}
        run: test "$CLASSIFICATION_RESULT" = success && test "$CODE_CHANGED" = true
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_HEAD }}
      - name: Verify candidate checkout
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_HEAD"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install current candidate in isolation
        run: |
          verify_root="$(mktemp -d)"
          export FANLOOP_DATA_HOME="$verify_root/data"
          export FANLOOP_CODEX_SKILLS_ROOT="$verify_root/skills/codex"
          export FANLOOP_AGENT_SKILLS_ROOT="$verify_root/skills/agents"
          export FANLOOP_TRAE_SKILLS_ROOT="$verify_root/skills/trae"
          export FANLOOP_CLAUDE_SKILLS_ROOT="$verify_root/skills/claude"
          export FANLOOP_CONFIG_SOURCE="$verify_root/config"
          mkdir -p "$FANLOOP_CONFIG_SOURCE/fanloop-workflow"
          cp -R internal/workflow/testdata/linear-runtime "$FANLOOP_CONFIG_SOURCE/fanloop-workflow/"
          cp -R internal/workflow/testdata/runtime-controls "$FANLOOP_CONFIG_SOURCE/fanloop-workflow/"
          git -C "$FANLOOP_CONFIG_SOURCE" init -b main
          git -C "$FANLOOP_CONFIG_SOURCE" add .
          git -C "$FANLOOP_CONFIG_SOURCE" -c user.name=CI -c user.email=ci@example.invalid commit -m 'Synthetic configuration'
          unset BOTMUX_CHAT_ID BOTMUX_SESSION_ID
          ./scripts/install-local.sh "$verify_root/build"
          "$FANLOOP_DATA_HOME/current/bin/fanloop" version | tee "$verify_root/version.json"
          grep -q "\"commit_sha\": \"$CANDIDATE_HEAD\"" "$verify_root/version.json"
          "$FANLOOP_DATA_HOME/current/bin/fanloop" doctor | tee "$verify_root/doctor.json"
          grep -q '"status": "healthy"' "$verify_root/doctor.json"

  governance:
    needs: changes
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.code != 'false')
    runs-on: ubuntu-latest
    steps:
      - name: Require successful code classification
        env:
          CLASSIFICATION_RESULT: ${{ needs.changes.result }}
          CODE_CHANGED: ${{ needs.changes.outputs.code }}
        run: test "$CLASSIFICATION_RESULT" = success && test "$CODE_CHANGED" = true
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_HEAD }}
      - name: Verify candidate checkout
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_HEAD"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Verify Botmux identity isolation
        run: go test ./tests/contracts ./tests/e2e -run 'Test(MergeEnvironmentScrubsBotmuxBindingByDefault|E2ECommandsScrubBotmuxBindingByDefault)$' -count=1
