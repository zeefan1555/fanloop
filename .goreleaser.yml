version: 2

builds:
  - id: commonloop
    binary: bin/commonloop
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/zeefan1555/commonloop/internal/buildinfo.ReleaseVersion={{ .Version }} -X github.com/zeefan1555/commonloop/internal/buildinfo.CLIVersion={{ .Version }} -X github.com/zeefan1555/commonloop/internal/buildinfo.Commit={{ .Env.COMMONLOOP_BUILD_COMMIT }}
    goos: [darwin, linux]
    goarch: [amd64, arm64]

archives:
  - id: commonloop
    builds: [commonloop]
    name_template: "commonloop-{{ .Version }}-{{ .Os }}-{{ .Arch }}"
    format: tar
    files:
      - "entrypoints/**/*"
      - "skills/**/*"
      - "workflows/*/*"

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ .Env.COMMONLOOP_RELEASE_VERSION }}"
