schema_version: 4

loop:
  intake:
    - prompt_ref: {file: prompt.yaml, prompt_id: back_to_earliest_affected_layer}
      when: {any_of: [[delivery_goal_changed]]}
      back_step_id: intake

  select_bind_skills:
    - prompt_ref: {file: prompt.yaml, prompt_id: back_to_earliest_affected_layer}
      when: {any_of: [[delivery_goal_changed]]}
      back_step_id: intake
    - prompt_ref: {file: prompt.yaml, prompt_id: back_to_earliest_affected_layer}
      when: {any_of: [[skill_plan_changed]]}
      back_step_id: select_bind_skills

  confirm_skill_plan:
    - prompt_ref: {file: prompt.yaml, prompt_id: back_to_earliest_affected_layer}
      when: {any_of: [[delivery_goal_changed]]}
      back_step_id: intake
    - prompt_ref: {file: prompt.yaml, prompt_id: back_to_earliest_affected_layer}
      when: {any_of: [[skill_plan_changed]]}
      back_step_id: select_bind_skills

  execute:
    - prompt_ref: {file: prompt.yaml, prompt_id: back_to_earliest_affected_layer}
      when: {any_of: [[delivery_goal_changed]]}
      back_step_id: intake
    - prompt_ref: {file: prompt.yaml, prompt_id: back_to_earliest_affected_layer}
      when: {any_of: [[skill_plan_changed]]}
      back_step_id: select_bind_skills
    - prompt_ref: {file: prompt.yaml, prompt_id: back_to_execution}
      when: {any_of: [[execution_gap]]}
      back_step_id: execute

  verify_report:
    - prompt_ref: {file: prompt.yaml, prompt_id: back_to_earliest_affected_layer}
      when: {any_of: [[delivery_goal_changed]]}
      back_step_id: intake
    - prompt_ref: {file: prompt.yaml, prompt_id: back_to_earliest_affected_layer}
      when: {any_of: [[verification_failed, skill_plan_changed]]}
      back_step_id: select_bind_skills
    - prompt_ref: {file: prompt.yaml, prompt_id: back_to_execution}
      when: {any_of: [[verification_failed, execution_gap]]}
      back_step_id: execute
    - prompt_ref: {file: prompt.yaml, prompt_id: back_to_earliest_affected_layer}
      when: {any_of: [[skill_plan_changed]]}
      back_step_id: select_bind_skills
    - prompt_ref: {file: prompt.yaml, prompt_id: back_to_execution}
      when: {any_of: [[execution_gap]]}
      back_step_id: execute
