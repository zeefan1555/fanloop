schema_version: 2

prompts:
  intake_flow:
    prompt: |
      收敛本次交付意图与约束：目标、仓库/工作区范围、硬约束、成功证据口径、非目标与排除项。写入并回读 Requirement Root 内通用命名的交付目标文件（如 delivery-goal.md）。不得选择或改写 pstack skill 正文；不得把 Cursor Task/subagent 指令搬进本 Prompt。目标已接受后若需修正，上报 delivery_goal_changed；完成时上报 delivery_goal_framed。Evidence 只带相对路径与 sha256。
    skills: []

  select_bind_skills_flow:
    prompt: |
      仅基于已接受的交付目标，从 workflows/pstack-delivery/skills/ 下 47 个原生 skill 的 frontmatter name: 中选择本轮需要绑定的子集，写入并回读 skill-plan.md（或等价路径）。计划须列出：skill id（= frontmatter name）、选用理由、预期产物、与目标验收口径的对应关系、可选/必选标记。SkillBinding id 必须等于 skills/ 下文件夹名（如 poteto-mode、make-bot-ui）；frontmatter name: 仅作展示，不写进 Binding id。不要在每一步绑定全部 47 个；只选本轮必要技能。不得改写 SKILL.md 正文或相对链接。目标变化上报 delivery_goal_changed；完成时上报 skill_plan_ready。
      已批准的 skill-plan.md 是权威绑定清单；磁盘 catalog 仍为 workflows/pstack-delivery/skills/ 下 47 个文件夹。下方 skills: 仅为运行时可调用的紧凑提示子集，不代表本轮全部必选，也不禁止未来计划绑定 YAML 未列出的其他 folder id。
    skills:
      - {id: figure-it-out, prompt: 可选：厘清问题空间与未知后再定绑定。, optional: true}
      - {id: how, prompt: 可选：需要可执行实施路径时参考。, optional: true}
      - {id: blast-radius, prompt: 可选：评估变更影响面时纳入。, optional: true}
      - {id: principle-subtract-before-you-add, prompt: 可选：优先做减法再扩展。, optional: true}
      - {id: principle-minimize-reader-load, prompt: 可选：降低读者/上下文负载。, optional: true}
      - {id: principle-boundary-discipline, prompt: 可选：强调边界与接口纪律。, optional: true}
      - {id: principle-prove-it-works, prompt: 可选：强调可证明工作证据时纳入。, optional: true}
      - {id: unslop, prompt: 可选：需要去空话与噪音时纳入。, optional: true}
      - {id: show-me-your-work, prompt: 可选：需要显式工作痕迹与证据链时纳入。, optional: true}
      - {id: technical-writing, prompt: 可选：交付含文档撰写时纳入。, optional: true}

  confirm_skill_plan_flow:
    prompt: |
      Human Step：展示已写入的 skill-plan（绑定清单、理由、预期产物与验收对应），等待人的全新明确批准或修改意见。批准时上报 skill_plan_approved；目标意图变化上报 delivery_goal_changed；绑定计划需调整上报 skill_plan_changed。Evidence 保存完整原始回复的本地记录路径与 sha256。不得由 Agent 代批，不得改写 pstack skill 正文。
    skills: []

  execute_flow:
    prompt: |
      严格按已批准的 skill-plan 执行原生 pstack skills：按计划顺序/依赖调用，宿主须原样尊重 skill 内 Cursor Task/subagent 文本；不得把 skill 正文粘贴或改写入本 Prompt。把执行过程与产物索引写入并回读 execution-report.md（相对路径）。计划错误上报 skill_plan_changed；目标变化上报 delivery_goal_changed；执行缺口可在本层重试时上报 execution_gap；完成时上报 skills_executed。
      已批准的 skill-plan.md 是权威绑定清单；磁盘 catalog 仍为 47 个 skill 文件夹。下方 skills: 仅为紧凑可调用提示；计划可绑定未列入本 YAML 的其他 folder id，无需事先把全部 47 个写进 Binding 列表。
    skills:
      - {id: figure-it-out, prompt: 按计划调用：问题澄清与探索。, optional: true}
      - {id: how, prompt: 按计划调用：实施方法。, optional: true}
      - {id: blast-radius, prompt: 按计划调用：影响面分析。, optional: true}
      - {id: principle-subtract-before-you-add, prompt: 按计划调用：先做减法。, optional: true}
      - {id: principle-minimize-reader-load, prompt: 按计划调用：降低读者负载。, optional: true}
      - {id: principle-boundary-discipline, prompt: 按计划调用：边界纪律。, optional: true}
      - {id: principle-prove-it-works, prompt: 按计划调用：可证明证据。, optional: true}
      - {id: unslop, prompt: 按计划调用：清理空话与冗余。, optional: true}
      - {id: show-me-your-work, prompt: 按计划调用：展示工作证据。, optional: true}
      - {id: technical-writing, prompt: 按计划调用：技术写作。, optional: true}
      - {id: reflect, prompt: 按计划调用：阶段性复盘（可选）。, optional: true}

  verify_report_flow:
    prompt: |
      对照交付目标与已批准 skill-plan，核验执行产物与成功证据；写入并回读 verification-report.md 与交付报告。全部通过时上报 delivery_verified 并 terminal。失败时写入完整 findings 到 verification 报告并上报 verification_failed，同时只选择最早受影响层：绑定/计划问题配 skill_plan_changed 回 select_bind_skills；执行缺口配 execution_gap 回 execute；目标本身错误配 delivery_goal_changed 回 intake。不得改写 pstack skill 正文。
    skills:
      - {id: create-verification-skill, prompt: 可选：需要沉淀新的验证 skill 时使用。, optional: true}
      - {id: maintain-verification-skill, prompt: 可选：需要更新既有验证 skill 时使用。, optional: true}
      - {id: principle-prove-it-works, prompt: 可选：用可证明证据核对交付结果。, optional: true}

  artifact_condition:
    prompt: 上报当前 Step 已写入、回读并通过本层门禁的 Requirement Root 相对文件路径。Summary 与 Evidence 不得复制文件正文。
    skills: []

  revision_scope_condition:
    prompt: |
      只上报已经接受结果中最早受影响的一层（goal / skill_plan / execution）。完整反馈写入 Requirement Root 本地文件；Result Evidence 只含相对路径与 sha256、固定分类与最小非敏感摘要。目标 Step 须先校验 SHA 再读取。
    skills: []

  human_decision_condition:
    prompt: 仅在当前 Human Step 收到人的全新明确批准后上报；不得由 Agent 代批。Evidence 指向完整原始回复的本地记录。
    skills: []

  verification_outcome_condition:
    prompt: 仅在独立核验无阻塞项且交付报告已回读时上报 passed。
    skills: []

  verification_written_condition:
    prompt: 上报已写入并回读的 verification 报告路径（含失败 findings）；可与最早受影响层的 revision Condition 同时上报。
    skills: []

  back_to_earliest_affected_layer:
    prompt: 按最早受影响层回到对应 Step；目标 Step 及其全部下游 Outputs 失效。
    skills: []

  back_to_execution:
    prompt: 回到 execute 补齐执行缺口或按验证失败的执行层 findings 重跑；不改写已批准的 skill-plan，除非同时满足 skill_plan_changed 路由。
    skills: []
