schema_version: 4

flow:
  bootstrap_techdesign:
    - prompt_ref: {file: prompt.yaml, prompt_id: bootstrap_techdesign_flow}
      when: {any_of: [[repository_workspace_prepared]]}
      next_step_id: clarify_requirements

  clarify_requirements:
    - prompt_ref: {file: prompt.yaml, prompt_id: clarify_requirements_flow}
      when: {any_of: [[requirements_grilled, requirements_document_published]]}
      next_step_id: confirm_requirements

  confirm_requirements:
    - prompt_ref: {file: prompt.yaml, prompt_id: confirm_requirements_flow}
      when:
        any_of:
          - [panorama_card_published, requirements_approved, requirements_approval_recorded, requirements_evidence_written, implementation_required]
          - [agent_approved, implementation_required]
      next_step_id: design_technical_solution
    - prompt_ref: {file: prompt.yaml, prompt_id: confirm_requirements_terminal}
      when:
        any_of:
          - [panorama_card_published, requirements_approved, requirements_approval_recorded, requirements_evidence_written, implementation_not_required]
          - [agent_approved, implementation_not_required]
      terminal: true

  design_technical_solution:
    - prompt_ref: {file: prompt.yaml, prompt_id: design_technical_solution_flow}
      when: {any_of: [[spec_written, tickets_written, technical_solution_document_published]]}
      next_step_id: implement_code

  implement_code:
    - prompt_ref: {file: prompt.yaml, prompt_id: implement_code_flow}
      when: {any_of: [[implementation_completed]]}
      next_step_id: maintain_verification_skill

  maintain_verification_skill:
    - prompt_ref: {file: prompt.yaml, prompt_id: maintain_verification_skill_flow}
      when: {any_of: [[verification_skill_ready]]}
      next_step_id: maintain_feature_map

  maintain_feature_map:
    - prompt_ref: {file: prompt.yaml, prompt_id: maintain_feature_map_flow}
      when: {any_of: [[feature_map_current]]}
      next_step_id: execute_test_cases

  execute_test_cases:
    - prompt_ref: {file: prompt.yaml, prompt_id: execute_test_cases_flow}
      when:
        any_of:
          - [validation_profile_selected, targeted_validation_passed, local_test_report_written]
          - [validation_profile_selected, e2e_entrypoint_passed, local_test_report_written]
      next_step_id: review_code

  review_code:
    - prompt_ref: {file: prompt.yaml, prompt_id: review_code_flow}
      when: {any_of: [[review_passed, review_report_written, candidate_head_frozen]]}
      next_step_id: coordinate_eval

  coordinate_eval:
    - prompt_ref: {file: prompt.yaml, prompt_id: coordinate_eval_flow}
      when: {any_of: [[eval_playbook_frozen]]}
      next_step_id: execute_eval_candidates

  execute_eval_candidates:
    - prompt_ref: {file: prompt.yaml, prompt_id: execute_eval_candidates_flow}
      when: {any_of: [[eval_candidates_completed]]}
      next_step_id: judge_eval

  judge_eval:
    - prompt_ref: {file: prompt.yaml, prompt_id: judge_eval_flow}
      when: {any_of: [[agent_eval_passed, acceptance_report_written]]}
      next_step_id: publish_candidate

  publish_candidate:
    - prompt_ref: {file: prompt.yaml, prompt_id: publish_candidate_flow}
      when: {any_of: [[pull_request_published]]}
      next_step_id: verify_ci_gates

  verify_ci_gates:
    - prompt_ref: {file: prompt.yaml, prompt_id: verify_ci_gates_flow}
      when: {any_of: [[repository_guardrails_verified, ci_gates_passed]]}
      next_step_id: execute_agent_acceptance

  execute_agent_acceptance:
    - prompt_ref: {file: prompt.yaml, prompt_id: execute_agent_acceptance_flow}
      when: {any_of: [[agent_acceptance_passed, acceptance_report_written]]}
      next_step_id: merge_code

  merge_code:
    - prompt_ref: {file: prompt.yaml, prompt_id: merge_code_flow}
      when: {any_of: [[code_merged, acceptance_report_written]]}
      terminal: true
