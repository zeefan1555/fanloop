schema_version: 5

flow:
  define_verification_contract:
    - prompt_ref: {file: prompt.yaml, prompt_id: define_verification_contract_flow}
      when: {any_of: [[verification_contract_written, requirements_approved, requirements_decision_recorded, panorama_presented]]}
      next_step_id: build_until_verified
    - prompt_ref: {file: prompt.yaml, prompt_id: define_verification_contract_rejected_terminal}
      when: {any_of: [[verification_contract_written, requirements_rejected, requirements_decision_recorded, panorama_presented]]}
      terminal: true

  build_until_verified:
    - prompt_ref: {file: prompt.yaml, prompt_id: build_until_verified_flow}
      when: {any_of: [[self_validation_passed, verification_report_written, candidate_identity_recorded, panorama_presented]]}
      next_step_id: certify_candidate

  certify_candidate:
    - prompt_ref: {file: prompt.yaml, prompt_id: certify_candidate_flow}
      when: {any_of: [[independent_review_passed, blackbox_verification_passed, main_agent_acceptance_passed, certification_report_written, certification_identity_frozen, panorama_presented]]}
      next_step_id: merge_and_update_local

  merge_and_update_local:
    - prompt_ref: {file: prompt.yaml, prompt_id: merge_and_update_local_flow}
      when: {any_of: [[delivery_main_unchanged, merge_request_published, remote_checks_passed, review_comment_synced, code_merged, merge_tree_verified, source_repository_updated, local_cli_updated, post_merge_smoke_passed, delivery_record_written, panorama_presented]]}
      terminal: true
