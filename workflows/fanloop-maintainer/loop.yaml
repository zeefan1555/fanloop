schema_version: 4

loop:
  define_verification_contract:
    - prompt_ref: {file: prompt.yaml, prompt_id: configuration_back_to_define}
      when: {any_of: [[configuration_change, requirements_changed, panorama_presented]]}
      back_step_id: define_verification_contract
    - prompt_ref: {file: prompt.yaml, prompt_id: back_to_define}
      when: {any_of: [[requirements_changed, panorama_presented, code_change]]}
      back_step_id: define_verification_contract

  build_until_verified:
    - prompt_ref: {file: prompt.yaml, prompt_id: configuration_back_to_define}
      when: {any_of: [[configuration_change, requirements_changed, panorama_presented]]}
      back_step_id: define_verification_contract
    - prompt_ref: {file: prompt.yaml, prompt_id: configuration_back_to_build}
      when: {any_of: [[configuration_change, configuration_needs_fix, panorama_presented]]}
      back_step_id: build_until_verified
    - prompt_ref: {file: prompt.yaml, prompt_id: back_to_define}
      when: {any_of: [[requirements_changed, panorama_presented, code_change]]}
      back_step_id: define_verification_contract

  certify_candidate:
    - prompt_ref: {file: prompt.yaml, prompt_id: configuration_back_to_define}
      when: {any_of: [[configuration_change, requirements_changed, panorama_presented]]}
      back_step_id: define_verification_contract
    - prompt_ref: {file: prompt.yaml, prompt_id: configuration_back_to_build}
      when: {any_of: [[configuration_change, configuration_needs_fix, panorama_presented]]}
      back_step_id: build_until_verified
    - prompt_ref: {file: prompt.yaml, prompt_id: back_to_define}
      when: {any_of: [[requirements_changed, certification_report_written, panorama_presented, code_change]]}
      back_step_id: define_verification_contract
    - prompt_ref: {file: prompt.yaml, prompt_id: back_to_build}
      when:
        any_of:
          - [independent_review_failed, certification_report_written, panorama_presented, code_change]
          - [blackbox_verification_failed, certification_report_written, panorama_presented, code_change]
          - [main_agent_changes_requested, certification_report_written, panorama_presented, code_change]
          - [candidate_changed, panorama_presented, code_change]
      back_step_id: build_until_verified

  merge_and_update_local:
    - prompt_ref: {file: prompt.yaml, prompt_id: configuration_back_to_define}
      when: {any_of: [[configuration_change, requirements_changed, panorama_presented]]}
      back_step_id: define_verification_contract
    - prompt_ref: {file: prompt.yaml, prompt_id: configuration_back_to_build}
      when: {any_of: [[configuration_change, configuration_needs_fix, panorama_presented]]}
      back_step_id: build_until_verified
    - prompt_ref: {file: prompt.yaml, prompt_id: back_to_define}
      when: {any_of: [[requirements_changed, panorama_presented, code_change]]}
      back_step_id: define_verification_contract
    - prompt_ref: {file: prompt.yaml, prompt_id: back_to_build}
      when:
        any_of:
          - [delivery_main_advanced, panorama_presented, code_change]
          - [candidate_changed, panorama_presented, code_change]
          - [merge_request_published, remote_product_checks_failed, panorama_presented, code_change]
      back_step_id: build_until_verified
