schema_version: 7
id: fanloop-maintainer

stages:
  - id: techdesign
    name: TechDesign
    jobs:
      - id: techdesign
        name: TechDesign
        steps:
          - {id: bootstrap_techdesign, name: 仓库范围确定, executor: agent}
          - {id: clarify_requirements, name: 需求澄清, executor: agent}
          - {id: design_technical_solution, name: 方案设计, executor: agent}
          - {id: confirm_technical_solution, name: 方案自主评审, executor: agent}

  - id: implement
    name: Implement
    jobs:
      - id: implement
        name: Implement
        steps:
          - {id: implement_code, name: 代码实现与过程 CR, executor: agent}
          - {id: review_code, name: 整体 Code Review, executor: agent}

  - id: test
    name: Test
    jobs:
      - id: test
        name: Test
        steps:
          - {id: execute_agent_acceptance, name: Agent 端到端测试, executor: agent}
          - {id: confirm_human_acceptance, name: 人类端到端测试, executor: human}
          - {id: handoff_merge_request, name: MR 门禁与交接, executor: agent}
