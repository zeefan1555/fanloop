schema_version: 1

prompts:
  bootstrap_techdesign_flow:
    prompt: |
      为反馈创建或安全复用独立 Issue Workspace 和源码 Worktree，记录 main 固定基线；存在已校验的 GitHub origin 时更新 origin/main，否则使用本地 main。完成后上报 repository_workspace_prepared；仓库范围发生变化时回到本 Step。
    skills:
      - {id: fanloop-dev-bootstrap, prompt: 使用该 Skill 准备可审计的 Issue Workspace、main 基线和只读调查环境。, optional: false}
  clarify_requirements_flow:
    prompt: |
      自行读取反馈、代码、日志和相关 ADR，澄清所有仍需人决定的问题，不把可查明的环境事实反问人。requirements.md 必须记录决策、约束、非目标、验收条件、1 至 3 个公开 CLI 验收场景及独立预期、验证路径、改造计划与 Open Questions。Open Questions 为空后，以 Requirement 身份为稳定标题创建或更新唯一飞书需求文档并语义回读；同时上报 requirements_grilled 与 requirements_document_published，不得编码。
    skills:
      - {id: fanloop-dev-grill-with-docs, prompt: 组合需求追问、公开 CLI 验收场景和飞书需求文档沉淀。, optional: false}
      - {id: fanloop-dev-grilling, prompt: 按 design-tree/frontier 完成分轮批量询问。, optional: false}
      - {id: fanloop-dev-domain-modeling, prompt: 挑战含混术语并整理 CONTEXT/ADR 候选。, optional: false}
  confirm_requirements_flow:
    prompt: |
      以 requirements.md 为唯一主审材料独立复核；可委托一个无实现上下文的独立 Sub-agent 检查完整性，并把结论与文件引用写入 Evidence。决策完整、Open Questions 为空且无需人作出新决定时，上报 agent_approved 与 implementation_required 或 implementation_not_required。仍缺真实产品决策时保持 blocked 并向用户询问；不得猜测。人工路径仍可使用最新审核卡、Panorama 与真实批准证据，但不是例行门禁。
    skills: []
  confirm_requirements_terminal:
    prompt: |
      已确认无需实现。保留 requirements.md、需求飞书文档与批准 Evidence，终止本次 Workflow。
    skills: []
  design_technical_solution_flow:
    prompt: |
      只根据已确认 requirements.md 生成本地 Spec，并拆成最少的纵向 Tickets；保留已确认公开 Test Seam 与 CLI 验收场景，不引入新产品决策。以 Requirement 身份为稳定标题创建或更新唯一飞书技术方案并语义回读后，上报 spec_written、tickets_written 与 technical_solution_document_published；发现缺失或冲突决策时上报 requirements_changed。
    skills:
      - {id: fanloop-dev-to-spec, prompt: 把已确认需求生成本地 Spec 并同步飞书技术方案。, optional: false}
      - {id: fanloop-dev-to-tickets, prompt: 把 Spec 拆成可独立验证的纵向 Tickets。, optional: false}
  implement_code_flow:
    prompt: |
      按需求、Spec 和 Ticket frontier 完成最小纵向实现、契约真值、ADR 与聚焦测试。只在已确认公开 Test Seam 上使用 TDD。把当前 HEAD、diff、实现结论、命令与结果写入 implementation-report.md；以 Requirement 身份为稳定标题创建或更新唯一飞书研发实现报告并语义回读。提交到本地分支，不推送、不创建 PR、不合并。完成上报 implementation_completed、implementation_report_written 与 implementation_document_published；发现需求、方案或实现问题时选择对应回流 Condition。
    skills:
      - {id: fanloop-dev-implement, prompt: 完成本地实现、聚焦验证、实现报告与飞书文档。, optional: false}
      - {id: fanloop-dev-tdd, prompt: 仅在存在独立正确预期的公开 Test Seam 上推进 red-green。, optional: true}
  review_code_flow:
    prompt: |
      对照需求、Spec、Tickets、ADR、仓库规则和 main...HEAD 独立审查最终本地 Diff，并运行风险档要求的全部本地验证。把 reviewed HEAD、findings、验证命令、退出码与结论更新到 implementation-report.md 和同一飞书研发实现报告，语义回读后再决定。通过时要求工作树干净，上报 review_passed、implementation_report_written、implementation_document_published 与 candidate_head_frozen；任何候选变化都会使验证和审查失效并回流。
    skills:
      - {id: fanloop-dev-code-review, prompt: 验证并审查最终 Diff，更新研发实现报告并冻结 reviewed HEAD。, optional: false}
  execute_agent_acceptance_flow:
    prompt: |
      只读冻结候选。在隔离的 FANLOOP_DATA_HOME 与四类 Skill Root 中从 candidate_head 执行 npm run install:local，回读版本与 Doctor；随后派发恰好一个无实现上下文的全新 Sub-agent，使用该绝对 CLI 路径和 requirements.md 中 1 至 3 个公开场景创建全新 Requirement 做真实黑盒验收。Sub-agent 只能使用公开 CLI 和叶子 --help，不得读源码、调用私有 helper、修改候选、使用机器人/Botmux/用户凭证或触碰全局 current。记录命令、输出、状态、清理和全局 current 未变证据到 acceptance-report.md；创建或更新唯一飞书验收交付报告并语义回读。产品失败上报 agent_acceptance_failed、报告、文档与唯一最早责任回流；基础设施失败保持 blocked；全部通过上报 agent_acceptance_passed、acceptance_report_written 与 acceptance_document_published。
    skills:
      - {id: fanloop-dev-agent-acceptance, prompt: 用隔离候选 CLI 和一个独立 Sub-agent 完成真实黑盒验收。, optional: false}
  merge_code_flow:
    prompt: |
      只接收同一 candidate_head 的本地验证、Review 与 Sub-agent 验收通过事实。幂等推送并创建或更新该分支唯一的 GitHub PR，回读 main Ruleset 和 candidate_head 上的 required checks；全部成功后执行 gh pr merge --auto --squash --match-head-commit。禁止 --admin、直接 push main、第二个 PR 或人工端到端验收。只有回读 state=MERGED 且 merge commit 非空才更新 acceptance-report.md 与同一飞书验收交付报告并上报 code_merged、acceptance_report_written、acceptance_document_published；候选漂移回实现，无歧义暂时失败上报 code_merge_failed 原地重试。
    skills:
      - {id: fanloop-dev-merge-code, prompt: 发布唯一 PR、校验精确 HEAD 的门禁并自动 squash 合码。, optional: false}
  update_local_cli_terminal:
    prompt: |
      先把本 Requirement 的控制器固定到 bound-release-home，再在精确 merge commit 的干净 detached worktree 中清除 FANLOOP 与 Botmux 覆盖并执行 npm run install:local。回读全局 current、version commit 与 Doctor；成功后把安装证据更新到 acceptance-report.md 和同一飞书验收交付报告并语义回读，上报 local_cli_updated、acceptance_report_written、acceptance_document_published 后终止。任何失败保持 blocked，不伪造成功，也不在成功后回滚 current。
    skills:
      - {id: fanloop-dev-update-local-cli, prompt: 固定旧控制器并把精确合并提交安装为本地全局 current。, optional: false}

  workspace_condition: {prompt: repository_workspace_prepared 输出 Issue Workspace 路径；范围变化上报 repository_scope_changed。, skills: []}
  requirements_document_condition: {prompt: requirements_grilled 仅在 requirements.md 完整、含 1 至 3 个公开 CLI 验收场景且 Open Questions 为空时输出路径。, skills: []}
  requirements_document_published_condition: {prompt: requirements_document_published 输出唯一需求飞书文档语义回读成功后的 URL。, skills: []}
  panorama_card_published_condition:
    prompt: 仅人工补充决策路径使用最新 Panorama；Agent 自主路径不执行。展示失败保持 blocked。
    skills:
      - {id: fanloop-dev-panorama, prompt: 展示本轮最新 Panorama 并返回精确快照路径。, optional: false}
  agent_approval_condition: {prompt: 仅当 Agent 或受托独立 Sub-agent 复核产物且无待人决策项时上报 approved，并附理由和产物引用。, skills: []}
  implementation_requirement_condition: {prompt: 根据确认需求选择 implementation_required 或 implementation_not_required，二者只能一个为 true。, skills: []}
  requirements_decision_condition: {prompt: 人工补充路径按真实结论选择 approved 或 rejected。, skills: []}
  requirements_approval_record_condition: {prompt: 人工补充路径只输出本轮全新批准消息 ID。, skills: []}
  requirements_evidence_condition: {prompt: 人工补充路径只在完整批准证据写入 requirements.md 后输出该路径。, skills: []}
  requirements_changed_condition: {prompt: 需求或已确认决策缺失、变化或冲突时上报 changed。, skills: []}
  spec_condition: {prompt: spec_written 输出本地 Spec 路径。, skills: []}
  tickets_condition: {prompt: tickets_written 输出本地 Tickets 路径。, skills: []}
  technical_solution_document_published_condition: {prompt: 输出唯一飞书技术方案语义回读成功后的 URL。, skills: []}
  technical_solution_change_condition: {prompt: 已确认需求不变但方案或公开 Test Seam 不可靠时上报 changes_requested。, skills: []}
  implementation_condition: {prompt: 按真实实现结论选择 completed 或 changes_requested。, skills: []}
  implementation_report_condition: {prompt: 输出包含当前 HEAD、diff、实现或审查结论及验证证据的 implementation-report.md。, skills: []}
  implementation_document_published_condition: {prompt: 输出唯一飞书研发实现报告语义回读成功后的 URL。, skills: []}
  review_condition: {prompt: 按真实审查结论选择 passed 或 failed。, skills: []}
  candidate_head_condition: {prompt: 仅在全部本地验证和审查通过且工作树干净时输出完整候选提交 SHA；下游必须只读该 SHA。, skills: []}
  agent_acceptance_condition: {prompt: 隔离安装和独立 Sub-agent 黑盒场景全部通过时输出 passed；确定产品失败输出 failed 和唯一责任回流；基础设施失败不提交。, skills: []}
  acceptance_report_condition: {prompt: 输出持续更新候选验收、PR/门禁、合码与本地安装事实的 acceptance-report.md，每项记录精确提交 SHA。, skills: []}
  acceptance_document_published_condition: {prompt: 输出唯一飞书验收交付报告语义回读成功后的 URL。, skills: []}
  merge_code_condition: {prompt: 回读唯一 PR 已 MERGED 且提交匹配时输出 PR URL 列表；无歧义暂时失败输出 failed。, skills: []}
  local_cli_updated_condition: {prompt: 仅在全局 current 的 version commit 精确等于 merge commit 且 Doctor healthy 时输出该完整 SHA。, skills: []}

  back_to_repository_scope: {prompt: 回到工作区准备，并失效目标 Step 及下游 Outputs。, skills: []}
  back_to_requirements: {prompt: 回到需求澄清，并失效目标 Step 及下游 Outputs。, skills: []}
  back_to_technical_solution: {prompt: 回到方案设计，并失效方案及下游 Outputs。, skills: []}
  back_to_implementation: {prompt: 回到代码实现；形成新 HEAD 后重跑验证、审查与 Sub-agent 验收。, skills: []}
  back_to_merge: {prompt: 只重试无歧义的自动合码动作；不得绕过 Ruleset 或创建第二个 PR。, skills: []}
