schema_version: 2

prompts:
  configuration_define_verification_contract:
    prompt: |
      先按实际 diff 与 configuration_scope 判断配置或代码；本步首个 Prompt 是分流入口，不代表自动选择配置通道。
      代码或混合改动执行 available_routes 中 code_change 分支的原 Prompt 及全部必需 Skills，原代码门禁不变；每次 Result 携带 code_change。只有纯配置执行下述步骤并携带 configuration_change。
      记录用户已明确的目标、允许文件、仓库、实际默认分支基线、live 目标和开始时间到 configuration_scope 对象。默认交付是仓库 PR 合码并同步已有相关 live 配置；用户明确只改 live 时不进入仓库流程。
      本机 live 根与仓库分别回读，记录本次目标文件修改前的内容摘要。范围明确即可提交 configuration_scope_recorded；无需另写 Verification Contract、Spec、Tickets 或派发子 Agent。
    skills:
      - {id: fanloop-dev-workflow, prompt: 按配置或代码分支执行四步交付，配置也必须 PR 合码与 live 回读。, optional: false}

  configuration_build_until_verified:
    prompt: |
      先按实际 diff 与 configuration_scope 判断配置或代码；本步首个 Prompt 是分流入口，不代表自动选择配置通道。
      代码或混合改动执行 available_routes 中 code_change 分支的原 Prompt 及全部必需 Skills，原代码门禁不变；每次 Result 携带 code_change。只有纯配置执行下述步骤并携带 configuration_change。
      在已授权工作区完成最小配置修改，移除冲突指引。只改 Workflow YAML、Skill 指令/参考材料及必要说明，保持未批准的 Step 身份不变。
      configuration_changes_written 记录实际文件、diff 摘要、工作区及配置目标。发现可执行脚本、Schema、Runtime 或测试改动时回 Define 改走代码路径；禁止为通过代码测试而修改 Golden。
    skills:
      - {id: fanloop-dev-workflow, prompt: 按配置或代码分支执行四步交付，配置也必须 PR 合码与 live 回读。, optional: false}

  configuration_certify_candidate:
    prompt: |
      先按实际 diff 与 configuration_scope 判断配置或代码；本步首个 Prompt 是分流入口，不代表自动选择配置通道。
      代码或混合改动执行 available_routes 中 code_change 分支的原 Prompt 及全部必需 Skills，原代码门禁不变；每次 Result 携带 code_change。只有纯配置执行下述步骤并携带 configuration_change。
      检查 diff 范围、相关引用与命令帮助；YAML/绑定变化用已有兼容 CLI 在隔离配置上加载/Doctor，并仅检查受影响路由。无需 Go 全量测试、代码黑盒、manifest 或 Release 构建。
      复核后提交配置候选，configuration_checked 记录精确 HEAD/tree、检查命令及真实结果、待同步 live 文件的基线摘要。检查失败用 configuration_needs_fix 回 Build，不能把未检查项写成 passed。
    skills:
      - {id: fanloop-dev-workflow, prompt: 按配置或代码分支执行四步交付，配置也必须 PR 合码与 live 回读。, optional: false}

  configuration_merge_and_update_local:
    prompt: |
      先按实际 diff 与 configuration_scope 判断配置或代码；本步首个 Prompt 是分流入口，不代表自动选择配置通道。
      代码或混合改动执行 available_routes 中 code_change 分支的原 Prompt 及全部必需 Skills，原代码门禁不变；每次 Result 携带 code_change。只有纯配置执行下述步骤并携带 configuration_change。
      只交付 configuration_check 对应的候选；确认 HEAD/tree 与已检 diff 未变化。用 gh 回读实际默认分支和当前分支的唯一 open/merged PR；没有则 push 并创建。已授权的配置交付默认继续 squash 合并，用 --match-head-commit 限定候选；执行实际 required checks，不使用 --admin 绕过。
      默认分支前进导致候选变化时回 Build 重新做相关配置检查。回读 PR 为 MERGED、精确 merge commit 和 tree 相等，更新本任务源码 worktree；原代码测试/CI 耦合另行说明，不伪造通过。
      从精确 merge commit 只同步本次批准的 Workflow/Skill 文件到已有 live 根。先与 Define 时的 live 摘要比较，存在并发修改时保留现场并 blocked；写后回读摘要和已有 CLI Doctor。不存在的整套 Workflow 不自行播种，entrypoints 属于 Release 文件时不热改其 Manifest 或复制二进制。
      live_configuration_synced 记录 live 根、每个更新文件及回读摘要、Doctor 结果。delivery-record.md 记录 PR/merge、源码、live 证据及耗时；全部完成后同时上报本配置 Route 的全部事实并 terminal。合码后的 live 失败保持 blocked，在同一 merge commit 上重试，不另造 PR 或伪造 CLI 安装事实。
    skills:
      - {id: fanloop-dev-workflow, prompt: 按配置或代码分支执行四步交付，配置也必须 PR 合码与 live 回读。, optional: false}

  maintenance_kind_condition:
    prompt: 每步按完整实际 diff 选择 configuration 或 code，二者互斥。纯配置才选 configuration；代码或混合改动选 code。分类变化先回 Define，不在 Build/Certify/Deliver 切换以跳过门禁。
    skills: []
  configuration_fact_condition:
    prompt: 只记录当前配置 Step 已发生的事实与真实证据。按当前 Prompt 填写对象；错误记录具体原因，未完成或结果不明保持 blocked。
    skills: []
  configuration_back_to_define:
    prompt: 目标、范围或变更类别变化时重新记录范围；涉及代码后执行原代码分支，不复用配置检查作为代码验收。
    skills: []
  configuration_back_to_build:
    prompt: 仅修复配置问题或集成最新默认分支，再重新做相关配置检查。已合码后的 live 同步失败保持原 Step blocked，修复同步后重试原 merge commit。
    skills: []

  panorama_delivery_condition:
    prompt: 进入当前 Step 后立即把最新 Panorama 作为第一条用户可见消息完整展示；成功后返回本次非 dry-run render 的精确 snapshot_path，失败时保持 blocked。
    skills:
      - {id: fanloop-dev-panorama, prompt: 展示 renderer 生成的唯一 Panorama，并返回精确 snapshot_path。, optional: false}

  define_verification_contract_flow:
    prompt: |
      准备独立 Issue Workspace、源码 worktree 和最新 main 基线。把用户已对齐的目标、范围、非目标、风险边界、Acceptance Set 与 Feature Impact Set 写入并回读 requirements.md。Acceptance Set 保留一至三个端到端场景；Feature Impact Set 列出全部受影响 Feature、公开入口以及关键成功和失败状态。每个场景固定公开命令、独立预期、退出码、可观察状态、副作用、证据和停止位置。

      执行子 Agent向主 Agent申请批准或拒绝，不得自批。使用 decision receipt 记录明确决定。批准前不得修改受管代码；批准时上报 verification_contract_written、requirements_approved、requirements_decision_recorded 与 panorama_presented。拒绝时上报对应拒绝组合并终止。飞书只作为可选阅读投影，不是 Route 必需事实。
    skills:
      - {id: fanloop-dev-bootstrap, prompt: 准备独立工作区、源码 worktree 和最新 main 基线。, optional: false}
      - {id: fanloop-dev-grill-with-docs, prompt: 生成 requirements.md、Acceptance Set、Feature Impact Set 并记录主 Agent决定。, optional: false}
      - {id: fanloop-dev-grilling, prompt: 按 design-tree/frontier 澄清仍未闭合的目标和边界。, optional: false}
      - {id: fanloop-dev-domain-modeling, prompt: 挑战含混术语并整理需进入契约真值或 ADR 的决定。, optional: false}
      - {id: fanloop-dev-decision-receipt, prompt: 安全记录并回读主 Agent需求决定。, optional: false}
  define_verification_contract_rejected_terminal:
    prompt: 主 Agent已拒绝当前 Verification Contract；保留 requirements.md 与 decision receipt 后结束。
    skills: []

  build_until_verified_flow:
    prompt: |
      若 Status 中存在 `delivery_main_head`，先执行 `git fetch origin`，确认它仍等于 `origin/main`，再把该提交集成到当前分支；冲突解决必须遵守 Verification Contract，不能改变已批准的 Step 身份或 IDL。集成完成前不得复用旧候选、旧验证或旧认证证据；若目标 main 再次前进，保持 blocked 或重新按最新完整 SHA 集成。

      当前执行 Agent直接在同一实现上下文完成方案、最小修改和自主验证。复杂度确实需要跨模块协调、方案取舍或并行拆分时才创建 spec.md 或 Tickets；它们不是独立门禁。持续执行：建立或复现基线 -> 最小修改 -> 聚焦测试 -> ./tests/run-unit -> 按 Feature Impact Set 使用真实公开 CLI 验证 -> 捕获证据和副作用 -> 分类失败并修复。

      用户表面变化时同步维护 Verification Skill 与 Feature Map。源码、测试或验证资产任一变化都产生新候选并使旧证据失效。只有存在新的可证伪假设时继续重试；同一失败重复且无新证据、环境或授权不可达时保持 blocked。需求或验收契约变化时上报 requirements_changed 回 Define。

      全部通过后提交当前分支，要求工作树 clean。记录 candidate_head、Git tree、候选 binary SHA-256、Acceptance/Impact 覆盖、run ID、manifest/snapshot、失败分类、修复和 ADR impact 到 verification-report.md。上报 self_validation_passed、verification_report_written、candidate_identity_recorded 与 panorama_presented。本 Step 不 push、不创建 PR。
    skills:
      - {id: fanloop-dev-tdd, prompt: 在已约定公开 Test Seam 上完成适用的 red-green；不适用项记录理由。, optional: false}
      - {id: fanloop-dev-implement, prompt: 持续完成实现、自验证、失败诊断、修复、候选提交和 verification-report.md。, optional: false}
      - {id: fanloop-dev-maintain-verification, prompt: 用户表面变化时维护 Verification Skill 与 Feature Map，并完成 source + live 验证。, optional: true}
      - {id: fanloop-dev-to-spec, prompt: 仅在复杂度确实需要时生成辅助 Spec。, optional: true}
      - {id: fanloop-dev-to-tickets, prompt: 仅在存在可独立并行的纵向工作时生成辅助 Tickets。, optional: true}

  certify_candidate_flow:
    prompt: |
      fetch origin 并冻结 certification_base、certification_head、Git tree 和候选 binary SHA-256；要求 origin/main=certification_base、HEAD=certification_head、工作树 clean 且 merge-base 正确。先派发不继承实现上下文的全新 Reviewer，读取 requirements.md、相关 ADR 和完整 diff。只有独立 Review 通过并回读原始 receipt 后，才再次核验 HEAD、Git tree、binary SHA-256 与冻结身份未变，再派发不读源码的全新 Verifier，只用隔离 candidate CLI、叶子 Help、Feature Map 和 Acceptance Set 做真实黑盒验证。

      执行子 Agent聚合前再次核验候选身份。Review 与黑盒都通过后，向主 Agent申请最终候选决定，使用 decision-receipt Skill 写入并精确回读 receipt。把原始回执、身份、覆盖和决定写入 certification-report.md。通过时上报 independent_review_passed、blackbox_verification_passed、main_agent_acceptance_passed、main_agent_acceptance_recorded、certification_report_written、certification_identity_frozen 与 panorama_presented。Review、黑盒或主 Agent要求修改时写完报告并选择对应失败 Condition 回 Build；目标变化回 Define；基础设施不可达保持 blocked。
    skills:
      - {id: fanloop-dev-code-review, prompt: 对冻结候选执行独立整体 Review 并返回原始回执。, optional: false}
      - {id: fanloop-dev-agent-acceptance, prompt: 对冻结候选执行无源码上下文的公开 CLI 黑盒验证。, optional: false}
      - {id: fanloop-dev-verify, prompt: 使用隔离候选、Feature Map 和 Acceptance Set 保留真实验证证据。, optional: false}
      - {id: fanloop-dev-decision-receipt, prompt: 安全记录并回读主 Agent最终候选决定。, optional: false}

  merge_and_update_local_flow:
    prompt: |
      只处理 certification-report.md 覆盖的同一 certification_base、certification_head、Git tree 和候选 binary SHA-256。先跨 open/merged 状态回读当前分支到 main 的唯一 PR；若已 MERGED，固定其唯一 merge commit 并直接恢复合并后本地步骤，不再用 base drift 把已合并事实回流。PR 尚未合并时再 fetch origin；若 origin/main 已前进，只记录新的完整 main SHA，上报 delivery_main_advanced 与 panorama_presented 回 Build，Deliver 不合入 main、不修改候选，也不保留单独的集成确认。

      main 未变化时，上报 delivery_main_unchanged；幂等创建或更新当前分支到 main 的唯一 PR，从 active main Ruleset 动态读取 required checks 的精确名称集合，等待这些检查在 certification_head 全部成功，并同步既有 Review 结论。产品类检查失败上报 remote_product_checks_failed 回 Build；基础设施失败保持 blocked。全部通过后用 --auto --squash --match-head-commit 合并，禁止 --admin、直接 push main 或第二个 PR。

      回读 MERGED 和唯一 merge commit，要求 merge commit 恰好一个 parent 且等于 certification_base、可达 origin/main，并验证 merge commit tree 等于 certification_head tree。固定当前 Requirement 控制器，只把本 Requirement 的 clean 源码 worktree 切到 detached merge commit；从该提交更新全局 current，回读 version 和 Doctor，再运行 post-merge verify smoke。全部通过后写入 delivery-record.md，上报 merge_request_published、remote_checks_passed、review_comment_synced、code_merged、merge_tree_verified、source_repository_updated、local_cli_updated、post_merge_smoke_passed、delivery_record_written 与 panorama_presented 后 terminal。已合并后的本地失败只重试同一 merge commit。
    skills:
      - {id: fanloop-dev-merge-and-update-local, prompt: 交付已认证候选，校验 merge tree，并从精确 merge commit 更新源码 worktree和全局 current。, optional: false}

  verification_contract_condition: {prompt: verification_contract_written 输出包含 Acceptance Set、Feature Impact Set、边界、风险与停止条件的 requirements.md。, skills: []}
  requirements_decision_condition: {prompt: 根据主 Agent明确决定选择 requirements_approved 或 requirements_rejected；二者只能一个。, skills: []}
  requirements_decision_record_condition: {prompt: requirements_decision_recorded 输出精确回读的主 Agent decision receipt ID。, skills: []}
  requirements_changed_condition: {prompt: 目标、范围、验收标准或治理契约变化时上报 requirements_changed。, skills: []}
  self_validation_condition: {prompt: 聚焦测试、./tests/run-unit 和 Feature Impact Set 的真实公开 CLI 验证全部覆盖最终候选时上报 self_validation_passed。, skills: []}
  verification_report_condition: {prompt: verification_report_written 输出引用原始 run/manifest/snapshot 并记录候选身份、覆盖、失败分类、修复和 ADR impact 的 verification-report.md。, skills: []}
  candidate_identity_condition: {prompt: candidate_identity_recorded 输出严格对象，至少包含 candidate_head、git_tree、binary_sha256、verification_contract_sha256 和 feature_impact_sha256。, skills: []}
  candidate_change_condition: {prompt: HEAD、Git tree、binary、验证资产、工作树或报告身份不一致时上报 candidate_changed。, skills: []}
  independent_review_condition: {prompt: 按独立 Reviewer 原始结论选择 independent_review_passed 或 independent_review_failed。, skills: []}
  blackbox_verification_condition:
    prompt: 按无源码上下文 Verifier 原始结论选择 blackbox_verification_passed 或 blackbox_verification_failed。Evidence 指向本次 fanloop verify 写出的 schema-1 manifest.json，且 outcome 与枚举一致。
    skills:
      - {id: fanloop-dev-verify, prompt: 按证据门禁取证。禁止手写 manifest，禁止没有这次 verify 运行就上报 passed。OUTPUT_INVALID 时重跑 verify，按文件里的 outcome 重报。, optional: false}
  main_agent_acceptance_condition: {prompt: 按主 Agent明确最终决定选择 main_agent_acceptance_passed 或 main_agent_changes_requested。, skills: []}
  main_agent_acceptance_record_condition: {prompt: main_agent_acceptance_recorded 输出精确回读的主 Agent最终候选 decision receipt ID。, skills: []}
  certification_report_condition: {prompt: certification_report_written 输出引用独立 Review、黑盒证据、候选身份和主 Agent决定的 certification-report.md。, skills: []}
  certification_identity_condition: {prompt: certification_identity_frozen 输出严格对象，至少包含 certification_base、certification_head、git_tree、binary_sha256 和 verification_assets_sha256。, skills: []}
  delivery_main_condition: {prompt: origin/main 等于 certification_base 时上报 delivery_main_unchanged；前进时上报 delivery_main_advanced=<新完整 SHA> 并回 Build。, skills: []}
  delivery_pr_status_condition: {prompt: 唯一 PR 已在当前或先前调用中合并并固定到同一 merge commit 时，上报 delivery_pr_already_merged=merged；该恢复路径不要求 delivery_main_unchanged。, skills: []}
  merge_request_condition: {prompt: merge_request_published 输出当前分支到 main 的唯一 GitHub PR URL。, skills: []}
  remote_checks_condition: {prompt: 精确 certification_head 的 required checks 全部成功时上报 remote_checks_passed；确定产品失败时上报 remote_product_checks_failed；基础设施失败不提交 Result。, skills: []}
  review_comment_condition: {prompt: review_comment_synced 输出独立 Review 结论同步到 PR 评论后的回读 receipt。, skills: []}
  code_merged_condition: {prompt: code_merged 输出回读 MERGED、单 parent 且可达目标默认分支的完整 merge commit SHA。, skills: []}
  merge_tree_condition: {prompt: merge commit tree 与 certification_head tree 完全相同时上报 merge_tree_verified。, skills: []}
  source_repository_updated_condition: {prompt: source_repository_updated 输出本任务源码 worktree detached 到的 merge commit SHA。, skills: []}
  local_cli_updated_condition: {prompt: local_cli_updated 输出全局 current version 回读的 merge commit SHA，且 Doctor healthy。, skills: []}
  post_merge_smoke_condition:
    prompt: 从 merge commit 安装的全局 current 完成 fanloop verify smoke 后，用该次写出的 schema-1 manifest.json 上报 post_merge_smoke_passed。
    skills:
      - {id: fanloop-dev-verify, prompt: 按证据门禁附上 smoke 写出的绝对路径 manifest.json，outcome 必须是 passed。禁止手写该文件。OUTPUT_INVALID 时重跑 smoke，按文件里的 outcome 重报。, optional: false}
  delivery_record_condition: {prompt: delivery_record_written 输出 delivery-record.md；代码交付记录原有 CLI/Doctor/smoke 证据，配置交付记录 PR、merge tree、源码 worktree、live 文件回读、配置 Doctor 与耗时。, skills: []}
  back_to_define: {prompt: 回到 Define，重新冻结 Verification Contract；旧候选、认证和交付证据全部失效。, skills: []}
  back_to_build: {prompt: 回到 Build，产生并验证新候选；旧认证、PR checks 和交付证据全部失效。, skills: []}
