schema_version: 4

loop:
  clarify_requirements:
    - prompt_ref: {file: prompt.yaml, prompt_id: back_to_requirements}
      when: {any_of: [[requirements_rework_requested]]}
      back_step_id: clarify_requirements

  confirm_requirements:
    - prompt_ref: {file: prompt.yaml, prompt_id: back_to_requirements}
      when: {any_of: [[requirements_rejected]]}
      back_step_id: clarify_requirements

  write_promotion_design:
    - prompt_ref: {file: prompt.yaml, prompt_id: back_to_requirements}
      when: {any_of: [[requirements_changed]]}
      back_step_id: clarify_requirements

  review_promotion_design:
    - prompt_ref: {file: prompt.yaml, prompt_id: back_to_requirements}
      when: {any_of: [[requirements_changed]]}
      back_step_id: clarify_requirements
    - prompt_ref: {file: prompt.yaml, prompt_id: back_to_design}
      when: {any_of: [[design_review_failed, design_review_written]]}
      back_step_id: write_promotion_design

  confirm_promotion_design:
    - prompt_ref: {file: prompt.yaml, prompt_id: back_to_requirements}
      when: {any_of: [[requirements_changed]]}
      back_step_id: clarify_requirements
    - prompt_ref: {file: prompt.yaml, prompt_id: back_to_design}
      when: {any_of: [[promotion_design_rejected]]}
      back_step_id: write_promotion_design
