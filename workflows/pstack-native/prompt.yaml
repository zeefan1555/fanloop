  design_solution_flow:
    prompt: |
      先执行 panorama_presented 的 Prompt/Skill；展示成功后再执行本步业务，并将展示回执与业务结果一起上报。
      理解受影响子系统；对非机械、过边界的形状变化运行设计探索。写入并回读 design-record.md（含备选方案与取舍）。
      完成设计探索上报 design_ready。确属机械改动、形状已具体时可上报 design_skipped，但必须写明 skip 理由；禁止默默跳过。
      验收标准变化上报 acceptance_changed；剧本错误上报 playbook_wrong。
      下方 skills 含全部 47 个 catalog id：本步无强制必选（机械跳过时可不调 how/architect），按设计需要选用。
