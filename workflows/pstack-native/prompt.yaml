  artifact_condition:
    prompt: 上报当前 Step 已写入、回读并通过本层门禁的 Requirement Root 相对文件路径。Summary 与 Evidence 不得复制文件正文。
    skills: []

  revision_scope_condition:
    prompt: |
      只上报已经接受结果中最早受影响的一层（playbook / acceptance / design / implement）。
      完整反馈写入 Requirement Root 本地文件；Result Evidence 只含相对路径与 sha256、固定分类与最小非敏感摘要。
    skills: []

  design_skip_condition:
    prompt: 仅当改动为机械且形状已具体时上报；output 必须是一句可审计的 skip 理由，禁止空字符串。
    skills: []

  verification_outcome_condition:
    prompt: 仅当 Evidence 指向本次 fanloop verify smoke 或 snapshot 写出的绝对路径 schema-1 manifest.json，且文件中的 outcome 等于 passed 时，上报 passed。禁止手写该文件。步骤只使用 .cursor/skills/verify-fanloop/SKILL.md。
    skills: []

  verification_written_condition:
    prompt: 上报已写入并回读的 verification 报告路径（含失败 findings）；可与最早受影响层的 revision Condition 同时上报。
    skills: []

  delivery_main_condition:
    prompt: 按 fetch 后的 origin/main 与候选基线关系选择 delivery_main_unchanged 或其他主线状态 Condition。
    skills: []

  delivery_pr_status_condition:
    prompt: 当唯一交付 PR 已处于 MERGED 时上报 delivery_pr_already_merged。
    skills: []

  merge_request_condition:
    prompt: merge_request_published 输出至少一个可打开的 PR URL。
    skills: []

  remote_checks_condition:
    prompt: 按 required checks 原始结论选择 remote_checks_passed 或 remote_product_checks_failed。
    skills: []

  code_merged_condition:
    prompt: code_merged 输出已回读的 merge commit 完整 SHA。
    skills: []

  merge_tree_condition:
    prompt: merge_tree_verified 表示 merge commit tree 与候选 head tree 一致。
    skills: []

  source_repository_updated_condition:
    prompt: source_repository_updated 输出源码 worktree 已切到的精确 merge commit。
    skills: []

  local_cli_updated_condition:
    prompt: local_cli_updated 输出本地 current CLI 已更新到的精确 commit。
    skills: []

  post_merge_smoke_condition:
    prompt: post_merge_smoke_passed 的 Evidence 必须指向合入后本次 verify 写出的 schema-1 manifest，且 outcome 为 passed。
    skills: []

  post_merge_smoke_failed_condition:
    prompt: post_merge_smoke_failed 的 Evidence 必须指向合入后本次 verify 写出的 schema-1 manifest，且 outcome 为 failed。
    skills: []

  delivery_record_condition:
    prompt: delivery_record_written 输出已回读的 delivery-record.md 相对路径。
    skills: []

  back_to_playbook:
    prompt: 回到选择工作剧本；其后步骤产物失效。
    skills: []

  back_to_acceptance:
    prompt: 回到定义验收标准；其后步骤产物失效。
    skills: []

  back_to_design:
    prompt: 回到方案设计；增量实现与验证产物失效。
    skills: []

  back_to_implement:
    prompt: 回到增量实现，按失败 findings 补齐或重做单元。
    skills: []
