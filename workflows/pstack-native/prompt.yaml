  implement_increments_flow:
    prompt: |
      先执行 panorama_presented 的 Prompt/Skill；展示成功后再执行本步业务，并将展示回执与业务结果一起上报。
      严格按已选剧本步骤与验收标准，将工作拆成可独立验证的单元，按序实现。每单元：最小改动 → 聚焦验证 → 通过后再进下一单元。
      写入并回读 execution-report.md（单元列表、证据索引、失败与修复）。宿主须原样尊重 skill 内 Task/subagent 指示；不得改写 pstack skill 正文。
      全部单元完成上报 increments_done。单元失败可本层重试并上报 increment_failed；设计不足上报 design_inadequate；验收变化上报 acceptance_changed。
      下方 skills 含全部 47 个 catalog id：sequence-verifiable-units 与 prove-it-works 必选，其余按需。不要无故绑满。
    skills:
      - {id: principle-sequence-verifiable-units, prompt: "必选。按可验证单元推进。", optional: false}
      - {id: principle-prove-it-works, prompt: "必选。每单元对照真实产物检查。", optional: false}
      - {id: tdd, prompt: "适用红绿时选用。", optional: true}
      - {id: arena, prompt: "实现形状多种合理写法时选用。", optional: true}
      - {id: swarm, prompt: "可并行独立切片时选用。", optional: true}
      - {id: show-me-your-work, prompt: "长任务或需审计痕迹时选用。", optional: true}
      - {id: unslop, prompt: "清理空话与噪音时选用。", optional: true}
      - {id: no-comments, prompt: "提交前处理注释问题时选用。", optional: true}
      - {id: typescript-best-practices, prompt: "TS 代码时选用。", optional: true}
      - {id: principle-fix-root-causes, prompt: "调试时选用。", optional: true}
      - {id: principle-build-the-lever, prompt: "应用工具/脚本代替手改时选用。", optional: true}
      - {id: principle-encode-lessons-in-structure, prompt: "把重复教训写成门禁时选用。", optional: true}
      - {id: principle-migrate-callers-then-delete-legacy-apis, prompt: "替换旧 API 时选用。", optional: true}
      - {id: principle-separate-before-serializing-shared-state, prompt: "并行写共享状态前选用。", optional: true}
      - {id: principle-make-operations-idempotent, prompt: "可重试操作设计时选用。", optional: true}
