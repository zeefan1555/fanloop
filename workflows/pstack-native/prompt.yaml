schema_version: 2

# pstack-native prompt 草案：每步挂全 47 个 catalog skill。
# 必选 optional: false；其余 optional: true 并标明「按需」或本步用途。
# Skill 正文真值在 workflows/pstack-native/skills/，禁止改 SKILL.md。

prompts:
  panorama_delivery_condition:
    prompt: |
      每次进入 Step（包括回流重入）先执行绑定 Skill，展示 renderer 生成的最新 Panorama，再执行业务 Prompt。
      展示成功后保留本次精确 panorama_snapshot_path，与业务 Condition 一同上报；同一次 Step 内不重复展示。
      渲染或展示失败、结果不明时报告 blocked，不提交成功 Condition 或选择 Route。
    skills:
      - {id: workflow-panorama, prompt: 原样展示本次 Panorama，成功后返回精确 snapshot_path。, optional: false}

  select_playbook_flow:
    prompt: |
      先执行 panorama_presented 的 Prompt/Skill；展示成功后再执行本步业务，并将展示回执与业务结果一起上报。
      根据用户目标，从 poteto-mode 的 playbook 菜单中选择一本工作剧本（Feature、Bug fix、Refactoring、Investigation 等），或在无合适窄剧本 / 大型跨切面工作时选择 figure-it-out。
      写入并回读 playbook-selection.md：所选剧本 id、理由、将原样遵守的步骤清单（或 figure-it-out 将设计的阶段占位）。不得改写 pstack skill 正文。
      选中现成剧本上报 playbook_selected；选中 figure-it-out 上报 figure_it_out_selected。Evidence 只含相对路径与 sha256。
      下方 skills 含全部 47 个 catalog id：仅 poteto-mode 必选，其余按需。不要无故绑满 47 个。
    skills:
      - {id: poteto-mode, prompt: "必选。读取 Principles 与 Playbooks 菜单，完成剧本匹配。", optional: false}
      - {id: figure-it-out, prompt: "目标过大或无窄剧本可匹配时选用。", optional: true}
      - {id: why, prompt: "需要动机/决策背景时选用。", optional: true}
      - {id: bro, prompt: "需要把目标说成人话时选用。", optional: true}
      - {id: recall, prompt: "需要回忆既有约定时选用。", optional: true}
      - {id: architect, prompt: "按需。本步可用 catalog skill `architect`。", optional: true}
      - {id: arena, prompt: "按需。本步可用 catalog skill `arena`。", optional: true}
