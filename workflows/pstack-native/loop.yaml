schema_version: 4

loop:
  # 加载器要求每个 Step 至少一条 Loop。已批准草案未写首步；playbook_wrong 用已有 back_to_playbook 回到自身。
  select_playbook:
    - prompt_ref: {file: prompt.yaml, prompt_id: back_to_playbook}
      when: {any_of: [[playbook_wrong, panorama_presented]]}
      back_step_id: select_playbook

  define_acceptance:
    - prompt_ref: {file: prompt.yaml, prompt_id: back_to_playbook}
      when: {any_of: [[playbook_wrong, panorama_presented]]}
      back_step_id: select_playbook

  design_solution:
    - prompt_ref: {file: prompt.yaml, prompt_id: back_to_acceptance}
      when: {any_of: [[acceptance_changed, panorama_presented]]}
      back_step_id: define_acceptance
    - prompt_ref: {file: prompt.yaml, prompt_id: back_to_playbook}
      when: {any_of: [[playbook_wrong, panorama_presented]]}
      back_step_id: select_playbook

  implement_increments:
    - prompt_ref: {file: prompt.yaml, prompt_id: back_to_acceptance}
      when: {any_of: [[acceptance_changed, panorama_presented]]}
      back_step_id: define_acceptance
    - prompt_ref: {file: prompt.yaml, prompt_id: back_to_design}
      when: {any_of: [[design_inadequate, panorama_presented]]}
      back_step_id: design_solution
    - prompt_ref: {file: prompt.yaml, prompt_id: back_to_implement}
      when: {any_of: [[increment_failed, panorama_presented]]}
      back_step_id: implement_increments

  verify_behavior:
    - prompt_ref: {file: prompt.yaml, prompt_id: back_to_implement}
      when: {any_of: [[verification_failed, panorama_presented], [increment_failed, panorama_presented]]}
      back_step_id: implement_increments
    - prompt_ref: {file: prompt.yaml, prompt_id: back_to_acceptance}
      when: {any_of: [[acceptance_changed, panorama_presented]]}
      back_step_id: define_acceptance
    - prompt_ref: {file: prompt.yaml, prompt_id: back_to_design}
      when: {any_of: [[design_inadequate, panorama_presented]]}
      back_step_id: design_solution

  merge_and_release:
    - prompt_ref: {file: prompt.yaml, prompt_id: back_to_implement}
      when: {any_of: [[remote_product_checks_failed, panorama_presented], [post_merge_smoke_failed, panorama_presented]]}
      back_step_id: implement_increments
    - prompt_ref: {file: prompt.yaml, prompt_id: back_to_acceptance}
      when: {any_of: [[acceptance_changed, panorama_presented]]}
      back_step_id: define_acceptance
