schema_version: 3

conditions:
  panorama_presented:
    prompt_ref: {file: prompt.yaml, prompt_id: panorama_delivery_condition}
    output: {key: panorama_snapshot_path, type: path, description: 本次成功展示的精确 Panorama 快照}
  playbook_selected:
    prompt_ref: {file: prompt.yaml, prompt_id: artifact_condition}
    output: {key: playbook_selection_path, type: path}
    exclusive_group: playbook_outcome
  figure_it_out_selected:
    prompt_ref: {file: prompt.yaml, prompt_id: artifact_condition}
    output: {key: playbook_selection_path, type: path}
    exclusive_group: playbook_outcome
  playbook_wrong:
    prompt_ref: {file: prompt.yaml, prompt_id: revision_scope_condition}
    output: {key: revision_scope, type: enum_value, values: [playbook]}
    exclusive_group: playbook_outcome

  acceptance_defined:
    prompt_ref: {file: prompt.yaml, prompt_id: artifact_condition}
    output: {key: acceptance_path, type: path}
    exclusive_group: acceptance_outcome
  acceptance_changed:
    prompt_ref: {file: prompt.yaml, prompt_id: revision_scope_condition}
    output: {key: revision_scope, type: enum_value, values: [acceptance]}
    exclusive_group: acceptance_outcome

  design_ready:
    prompt_ref: {file: prompt.yaml, prompt_id: artifact_condition}
    output: {key: design_record_path, type: path}
    exclusive_group: design_outcome
  design_skipped:
    prompt_ref: {file: prompt.yaml, prompt_id: design_skip_condition}
    output: {key: design_skip_reason, type: string}
    exclusive_group: design_outcome
  design_inadequate:
    prompt_ref: {file: prompt.yaml, prompt_id: revision_scope_condition}
    output: {key: revision_scope, type: enum_value, values: [design]}
    exclusive_group: design_outcome

  increments_done:
    prompt_ref: {file: prompt.yaml, prompt_id: artifact_condition}
    output: {key: execution_report_path, type: path}
    exclusive_group: implement_outcome
  increment_failed:
    prompt_ref: {file: prompt.yaml, prompt_id: revision_scope_condition}
    output: {key: revision_scope, type: enum_value, values: [implement]}
    exclusive_group: implement_outcome

  delivery_verified:
    prompt_ref: {file: prompt.yaml, prompt_id: verification_outcome_condition}
    output: {key: delivery_verification_result, type: enum_value, values: [passed], source: verify.evidence.outcome}
    exclusive_group: verify_outcome
  verification_failed:
    prompt_ref: {file: prompt.yaml, prompt_id: verification_written_condition}
    output: {key: verification_report_path, type: path}
    exclusive_group: verify_outcome

  delivery_main_unchanged:
    prompt_ref: {file: prompt.yaml, prompt_id: delivery_main_condition}
    output: {key: delivery_main_status, type: enum_value, values: [unchanged]}
    exclusive_group: delivery_main_outcome
  delivery_pr_already_merged:
    prompt_ref: {file: prompt.yaml, prompt_id: delivery_pr_status_condition}
    output: {key: delivery_pr_status, type: enum_value, values: [merged]}
    exclusive_group: delivery_main_outcome
  merge_request_published:
    prompt_ref: {file: prompt.yaml, prompt_id: merge_request_condition}
    output: {key: merge_request_urls, type: url_list, min_items: 1, description: PR}
  remote_checks_passed:
    prompt_ref: {file: prompt.yaml, prompt_id: remote_checks_condition}
    output: {key: remote_checks_result, type: enum_value, values: [passed]}
    exclusive_group: remote_checks_outcome
  remote_product_checks_failed:
    prompt_ref: {file: prompt.yaml, prompt_id: remote_checks_condition}
    output: {key: remote_checks_result, type: enum_value, values: [product_failed]}
    exclusive_group: remote_checks_outcome
  code_merged:
    prompt_ref: {file: prompt.yaml, prompt_id: code_merged_condition}
    output: {key: merge_commit, type: string}
  merge_tree_verified:
    prompt_ref: {file: prompt.yaml, prompt_id: merge_tree_condition}
    output: {key: merge_tree_verification, type: enum_value, values: [passed]}
  source_repository_updated:
    prompt_ref: {file: prompt.yaml, prompt_id: source_repository_updated_condition}
    output: {key: source_repository_commit, type: string}
  local_cli_updated:
    prompt_ref: {file: prompt.yaml, prompt_id: local_cli_updated_condition}
    output: {key: local_cli_commit, type: string}
  post_merge_smoke_passed:
    prompt_ref: {file: prompt.yaml, prompt_id: post_merge_smoke_condition}
    output: {key: post_merge_smoke_result, type: enum_value, values: [passed], source: verify.evidence.outcome}
  post_merge_smoke_failed:
    prompt_ref: {file: prompt.yaml, prompt_id: post_merge_smoke_failed_condition}
    output: {key: post_merge_smoke_result, type: enum_value, values: [failed], source: verify.evidence.outcome}
  delivery_record_written:
    prompt_ref: {file: prompt.yaml, prompt_id: delivery_record_condition}
    output: {key: delivery_record_path, type: path}
