    exclusive_group: technical_decision_outcome
  benefits_changed:
    prompt_ref: {file: prompt.yaml, prompt_id: feedback_scope_condition}
    output: {key: technical_feedback_scope, type: enum_value, values: [benefits]}
    exclusive_group: technical_decision_outcome
  delivery_changed:
    prompt_ref: {file: prompt.yaml, prompt_id: feedback_scope_condition}
    output: {key: technical_feedback_scope, type: enum_value, values: [delivery]}
    exclusive_group: technical_decision_outcome
  presentation_changed:
    prompt_ref: {file: prompt.yaml, prompt_id: feedback_scope_condition}
    output: {key: technical_feedback_scope, type: enum_value, values: [presentation]}
    exclusive_group: technical_decision_outcome
