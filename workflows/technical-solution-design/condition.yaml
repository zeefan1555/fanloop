schema_version: 2

conditions:
  panorama_card_published:
    prompt_ref: {file: prompt.yaml, prompt_id: panorama_card_published_condition}
    output: {key: panorama_snapshot_path, type: path, description: 本次成功展示的精确 Panorama 快照}

  background_defined:
    prompt_ref: {file: prompt.yaml, prompt_id: section_artifact_condition}
    output: {key: background_section_path, type: path}
    exclusive_group: technical_decision_outcome
  core_problem_defined:
    prompt_ref: {file: prompt.yaml, prompt_id: section_artifact_condition}
    output: {key: problem_section_path, type: path}
    exclusive_group: technical_decision_outcome
  design_objectives_defined:
    prompt_ref: {file: prompt.yaml, prompt_id: section_artifact_condition}
    output: {key: objectives_section_path, type: path}
    exclusive_group: technical_decision_outcome
  problem_document_published:
    prompt_ref: {file: prompt.yaml, prompt_id: stage_document_condition}
    output: {key: problem_document_url, type: url, description: 问题定义文档}
  technical_problem_approved:
    prompt_ref: {file: prompt.yaml, prompt_id: human_approval_condition}
    output: {key: problem_approval_decision, type: enum_value, values: [approved]}
    exclusive_group: technical_decision_outcome

  solution_research_completed:
    prompt_ref: {file: prompt.yaml, prompt_id: section_artifact_condition}
    output: {key: research_section_path, type: path}
    exclusive_group: technical_decision_outcome
  overall_solution_designed:
    prompt_ref: {file: prompt.yaml, prompt_id: section_artifact_condition}
    output: {key: overall_solution_section_path, type: path}
    exclusive_group: technical_decision_outcome
  architecture_diagram_written:
    prompt_ref: {file: prompt.yaml, prompt_id: architecture_diagram_condition}
    output: {key: architecture_diagram_path, type: path}
  key_solutions_designed:
    prompt_ref: {file: prompt.yaml, prompt_id: section_artifact_condition}
    output: {key: key_solutions_section_path, type: path}
    exclusive_group: technical_decision_outcome
  solution_document_published:
    prompt_ref: {file: prompt.yaml, prompt_id: stage_document_condition}
    output: {key: solution_document_url, type: url, description: 方案设计文档}
  solution_direction_approved:
    prompt_ref: {file: prompt.yaml, prompt_id: human_approval_condition}
    output: {key: solution_direction_decision, type: enum_value, values: [approved]}
    exclusive_group: technical_decision_outcome

  solution_benefits_defined:
    prompt_ref: {file: prompt.yaml, prompt_id: section_artifact_condition}
    output: {key: benefits_section_path, type: path}
    exclusive_group: technical_decision_outcome
  delivery_plan_defined:
    prompt_ref: {file: prompt.yaml, prompt_id: section_artifact_condition}
    output: {key: delivery_section_path, type: path}
    exclusive_group: technical_decision_outcome
  technical_solution_written:
    prompt_ref: {file: prompt.yaml, prompt_id: section_artifact_condition}
    output: {key: technical_solution_path, type: path}
    exclusive_group: technical_decision_outcome
  technical_solution_review_passed:
    prompt_ref: {file: prompt.yaml, prompt_id: review_condition}
    output: {key: technical_solution_review_result, type: enum_value, values: [passed]}
    exclusive_group: technical_decision_outcome
  technical_solution_review_written:
    prompt_ref: {file: prompt.yaml, prompt_id: review_written_condition}
    output: {key: technical_solution_review_path, type: path}
  technical_solution_document_published:
    prompt_ref: {file: prompt.yaml, prompt_id: stage_document_condition}
    output: {key: technical_solution_document_url, type: url, description: 完整技术方案文档}
  technical_solution_approved:
    prompt_ref: {file: prompt.yaml, prompt_id: human_approval_condition}
    output: {key: technical_solution_decision, type: enum_value, values: [approved]}
    exclusive_group: technical_decision_outcome

  background_changed:
    prompt_ref: {file: prompt.yaml, prompt_id: feedback_scope_condition}
    output: {key: technical_feedback_scope, type: enum_value, values: [background]}
    exclusive_group: technical_decision_outcome
  problem_changed:
