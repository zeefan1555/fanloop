schema_version: 4

flow:
  frame_requirement_background:
    - prompt_ref: {file: prompt.yaml, prompt_id: frame_requirement_background_flow}
      when: {any_of: [[background_defined]]}
      next_step_id: analyze_core_problem

  analyze_core_problem:
    - prompt_ref: {file: prompt.yaml, prompt_id: analyze_core_problem_flow}
      when: {any_of: [[core_problem_defined]]}
      next_step_id: define_design_objectives

  define_design_objectives:
    - prompt_ref: {file: prompt.yaml, prompt_id: define_design_objectives_flow}
      when: {any_of: [[design_objectives_defined]]}
      next_step_id: confirm_technical_problem

  confirm_technical_problem:
    - prompt_ref: {file: prompt.yaml, prompt_id: confirm_technical_problem_flow}
      when: {any_of: [[problem_document_published, panorama_card_published, technical_problem_approved]]}
      next_step_id: research_solution_options

  research_solution_options:
    - prompt_ref: {file: prompt.yaml, prompt_id: research_solution_options_flow}
      when: {any_of: [[solution_research_completed]]}
      next_step_id: design_overall_solution

  design_overall_solution:
    - prompt_ref: {file: prompt.yaml, prompt_id: design_overall_solution_flow}
      when: {any_of: [[overall_solution_designed, architecture_diagram_written]]}
      next_step_id: design_key_solutions

  design_key_solutions:
    - prompt_ref: {file: prompt.yaml, prompt_id: design_key_solutions_flow}
      when: {any_of: [[key_solutions_designed]]}
      next_step_id: confirm_solution_direction

  confirm_solution_direction:
    - prompt_ref: {file: prompt.yaml, prompt_id: confirm_solution_direction_flow}
      when: {any_of: [[solution_document_published, panorama_card_published, solution_direction_approved]]}
      next_step_id: evaluate_solution_benefits

  evaluate_solution_benefits:
    - prompt_ref: {file: prompt.yaml, prompt_id: evaluate_solution_benefits_flow}
      when: {any_of: [[solution_benefits_defined]]}
      next_step_id: plan_solution_delivery

  plan_solution_delivery:
    - prompt_ref: {file: prompt.yaml, prompt_id: plan_solution_delivery_flow}
      when: {any_of: [[delivery_plan_defined]]}
      next_step_id: write_technical_solution

  write_technical_solution:
    - prompt_ref: {file: prompt.yaml, prompt_id: write_technical_solution_flow}
      when: {any_of: [[technical_solution_written]]}
      next_step_id: review_technical_solution

  review_technical_solution:
    - prompt_ref: {file: prompt.yaml, prompt_id: review_technical_solution_flow}
      when: {any_of: [[technical_solution_review_passed, technical_solution_review_written]]}
      next_step_id: confirm_technical_solution

  confirm_technical_solution:
    - prompt_ref: {file: prompt.yaml, prompt_id: confirm_technical_solution_flow}
      when: {any_of: [[technical_solution_document_published, panorama_card_published, technical_solution_approved]]}
      terminal: true
