schema_version: 4

loop:
  frame_requirement_background:
    - prompt_ref: {file: prompt.yaml, prompt_id: back_to_earliest_affected_section}
      when: {any_of: [[background_changed]]}
      back_step_id: frame_requirement_background

  analyze_core_problem:
    - prompt_ref: {file: prompt.yaml, prompt_id: back_to_earliest_affected_section}
      when: {any_of: [[background_changed]]}
      back_step_id: frame_requirement_background

  define_design_objectives:
    - prompt_ref: {file: prompt.yaml, prompt_id: back_to_earliest_affected_section}
      when: {any_of: [[background_changed]]}
      back_step_id: frame_requirement_background
    - prompt_ref: {file: prompt.yaml, prompt_id: back_to_earliest_affected_section}
      when: {any_of: [[problem_changed]]}
      back_step_id: analyze_core_problem

  confirm_technical_problem:
    - prompt_ref: {file: prompt.yaml, prompt_id: back_to_earliest_affected_section}
      when: {any_of: [[problem_document_published, panorama_card_published, background_changed]]}
      back_step_id: frame_requirement_background
    - prompt_ref: {file: prompt.yaml, prompt_id: back_to_earliest_affected_section}
      when: {any_of: [[problem_document_published, panorama_card_published, problem_changed]]}
      back_step_id: analyze_core_problem
    - prompt_ref: {file: prompt.yaml, prompt_id: back_to_earliest_affected_section}
      when: {any_of: [[problem_document_published, panorama_card_published, objectives_changed]]}
      back_step_id: define_design_objectives

  research_solution_options:
    - prompt_ref: {file: prompt.yaml, prompt_id: back_to_earliest_affected_section}
      when: {any_of: [[background_changed]]}
      back_step_id: frame_requirement_background
    - prompt_ref: {file: prompt.yaml, prompt_id: back_to_earliest_affected_section}
      when: {any_of: [[problem_changed]]}
      back_step_id: analyze_core_problem
    - prompt_ref: {file: prompt.yaml, prompt_id: back_to_earliest_affected_section}
      when: {any_of: [[objectives_changed]]}
      back_step_id: define_design_objectives

  design_overall_solution:
    - prompt_ref: {file: prompt.yaml, prompt_id: back_to_earliest_affected_section}
      when: {any_of: [[background_changed]]}
      back_step_id: frame_requirement_background
    - prompt_ref: {file: prompt.yaml, prompt_id: back_to_earliest_affected_section}
      when: {any_of: [[problem_changed]]}
      back_step_id: analyze_core_problem
    - prompt_ref: {file: prompt.yaml, prompt_id: back_to_earliest_affected_section}
      when: {any_of: [[objectives_changed]]}
      back_step_id: define_design_objectives
    - prompt_ref: {file: prompt.yaml, prompt_id: back_to_earliest_affected_section}
      when: {any_of: [[research_changed]]}
      back_step_id: research_solution_options

  design_key_solutions:
    - prompt_ref: {file: prompt.yaml, prompt_id: back_to_earliest_affected_section}
      when: {any_of: [[background_changed]]}
      back_step_id: frame_requirement_background
    - prompt_ref: {file: prompt.yaml, prompt_id: back_to_earliest_affected_section}
      when: {any_of: [[problem_changed]]}
      back_step_id: analyze_core_problem
    - prompt_ref: {file: prompt.yaml, prompt_id: back_to_earliest_affected_section}
      when: {any_of: [[objectives_changed]]}
      back_step_id: define_design_objectives
    - prompt_ref: {file: prompt.yaml, prompt_id: back_to_earliest_affected_section}
      when: {any_of: [[research_changed]]}
      back_step_id: research_solution_options
    - prompt_ref: {file: prompt.yaml, prompt_id: back_to_earliest_affected_section}
      when: {any_of: [[overall_solution_changed]]}
      back_step_id: design_overall_solution

  confirm_solution_direction:
    - prompt_ref: {file: prompt.yaml, prompt_id: back_to_earliest_affected_section}
      when: {any_of: [[solution_document_published, panorama_card_published, background_changed]]}
      back_step_id: frame_requirement_background
    - prompt_ref: {file: prompt.yaml, prompt_id: back_to_earliest_affected_section}
      when: {any_of: [[solution_document_published, panorama_card_published, problem_changed]]}
      back_step_id: analyze_core_problem
    - prompt_ref: {file: prompt.yaml, prompt_id: back_to_earliest_affected_section}
      when: {any_of: [[solution_document_published, panorama_card_published, objectives_changed]]}
      back_step_id: define_design_objectives
    - prompt_ref: {file: prompt.yaml, prompt_id: back_to_earliest_affected_section}
      when: {any_of: [[solution_document_published, panorama_card_published, research_changed]]}
      back_step_id: research_solution_options
    - prompt_ref: {file: prompt.yaml, prompt_id: back_to_earliest_affected_section}
      when: {any_of: [[solution_document_published, panorama_card_published, overall_solution_changed]]}
      back_step_id: design_overall_solution
    - prompt_ref: {file: prompt.yaml, prompt_id: back_to_earliest_affected_section}
      when: {any_of: [[solution_document_published, panorama_card_published, key_solutions_changed]]}
      back_step_id: design_key_solutions

  evaluate_solution_benefits:
    - prompt_ref: {file: prompt.yaml, prompt_id: back_to_earliest_affected_section}
      when: {any_of: [[background_changed]]}
      back_step_id: frame_requirement_background
    - prompt_ref: {file: prompt.yaml, prompt_id: back_to_earliest_affected_section}
      when: {any_of: [[problem_changed]]}
      back_step_id: analyze_core_problem
    - prompt_ref: {file: prompt.yaml, prompt_id: back_to_earliest_affected_section}
