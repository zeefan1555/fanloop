    - prompt_ref: {file: prompt.yaml, prompt_id: back_to_earliest_affected_section}
      when: {any_of: [[technical_solution_document_published, panorama_card_published, overall_solution_changed]]}
      back_step_id: design_overall_solution
    - prompt_ref: {file: prompt.yaml, prompt_id: back_to_earliest_affected_section}
      when: {any_of: [[technical_solution_document_published, panorama_card_published, key_solutions_changed]]}
