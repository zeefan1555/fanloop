    - prompt_ref: {file: prompt.yaml, prompt_id: back_to_earliest_affected_section}
      when: {any_of: [[delivery_changed]]}
      back_step_id: plan_solution_delivery

  review_technical_solution:
    - prompt_ref: {file: prompt.yaml, prompt_id: back_to_earliest_affected_section}
      when: {any_of: [[technical_solution_review_written, background_changed]]}
      back_step_id: frame_requirement_background
    - prompt_ref: {file: prompt.yaml, prompt_id: back_to_earliest_affected_section}
      when: {any_of: [[technical_solution_review_written, problem_changed]]}
      back_step_id: analyze_core_problem
    - prompt_ref: {file: prompt.yaml, prompt_id: back_to_earliest_affected_section}
      when: {any_of: [[technical_solution_review_written, objectives_changed]]}
