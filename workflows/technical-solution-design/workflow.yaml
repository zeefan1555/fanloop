schema_version: 7
id: technical-solution-design

stages:
  - id: problem
    name: 业务问题
    jobs:
      - id: problem
        name: 业务问题
        steps:
          - {id: frame_requirement_background, name: 业务背景, executor: agent}
          - {id: define_goals_and_problems, name: 目标与问题定义, executor: agent}
          - {id: define_business_constraints, name: 业务特点与技术约束, executor: agent}
          - {id: confirm_technical_problem, name: 问题与约束审核, executor: human}

  - id: solution
    name: 技术判断
    jobs:
      - id: solution
        name: 技术判断
        steps:
          - {id: research_solution_options, name: 业界/业内方案调研, executor: agent}
          - {id: design_overall_solution, name: 总体方案设计, executor: agent}
          - {id: design_key_solutions, name: 关键模块设计, executor: agent}
          - {id: record_technical_decisions, name: 核心技术决策与取舍, executor: agent}
          - {id: confirm_solution_direction, name: 方案与决策审核, executor: human}

  - id: document
    name: 结果与规划
    jobs:
      - id: document
        name: 结果与规划
        steps:
          - {id: plan_solution_delivery, name: 落地路径与风险控制, executor: agent}
          - {id: evaluate_solution_benefits, name: 结果收益, executor: agent}
          - {id: write_retrospective_and_roadmap, name: 复盘与后续规划, executor: agent}
          - {id: write_summary, name: 摘要, executor: agent}
          - {id: write_technical_solution, name: 文档组装, executor: agent}
          - {id: review_technical_solution, name: 文档审校, executor: agent}
          - {id: confirm_technical_solution, name: 文档终审, executor: human}
