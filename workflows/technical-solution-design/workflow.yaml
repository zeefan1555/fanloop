schema_version: 7
id: technical-solution-design

stages:
  - id: problem
    name: 问题定义
    jobs:
      - id: problem
        name: 问题定义
        steps:
          - {id: frame_requirement_background, name: 需求背景, executor: agent}
          - {id: analyze_core_problem, name: 核心问题, executor: agent}
          - {id: define_design_objectives, name: 设计目标, executor: agent}
          - {id: confirm_technical_problem, name: 问题审核, executor: human}

  - id: solution
    name: 方案设计
    jobs:
      - id: solution
        name: 方案设计
        steps:
          - {id: research_solution_options, name: 方案调研, executor: agent}
          - {id: design_overall_solution, name: 总体方案, executor: agent}
          - {id: design_key_solutions, name: 难点解法, executor: agent}
          - {id: confirm_solution_direction, name: 方案审核, executor: human}

  - id: document
    name: 方案成文
    jobs:
      - id: document
        name: 方案成文
        steps:
          - {id: evaluate_solution_benefits, name: 方案收益, executor: agent}
          - {id: plan_solution_delivery, name: 落地规划, executor: agent}
          - {id: write_technical_solution, name: 方案成文, executor: agent}
          - {id: review_technical_solution, name: 方案审校, executor: agent}
          - {id: confirm_technical_solution, name: 方案终审, executor: human}
