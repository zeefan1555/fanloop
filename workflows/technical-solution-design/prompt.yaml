schema_version: 2

common_skills:
  - {id: grill-with-docs, prompt: 使用该 Skill 对当前 Step 的目标、约束、输入、输出和验收标准逐项澄清，取得人的明确确认后再开工。, optional: false}
  - {id: human-step-jump, prompt: 当人要求跳转时，使用该 Skill 展示影响并确认目标 Step。, optional: true}

prompts:
  step_start_control:
    prompt: 人确认当前 Step 的目标、约束和验收条件后启动当前 Step。
    skills: []

  step_jump_control:
    prompt: 人确认跳转目标及其跳过、失效和缺失依赖影响后跳转。
    skills: []

  frame_requirement_background_flow:
    prompt: |
      先用一句话固定全文主题：基于什么业务特点，通过什么技术方案，解决什么问题，带来什么结果。再只写业务背景，说明具体业务场景、业务所处阶段、核心指标、参与方、关键链路、当前瓶颈和为什么值得投入，帮助项目外读者快速进入上下文；关键事实标明来源和证据状态，区分现状事实、估算、目标和待确认信息，写入并回读 .technical-solution/sections/01-business-background.md。不得分析根因、定义方案或堆叠架构细节。完成时上报 background_defined；证据仍可调查时继续工作。
    skills:
      - {id: technical-background-framing, prompt: 使用该 Skill 形成简洁、证据可追溯的业务背景片段。, optional: false}

  define_goals_and_problems_flow:
    prompt: |
      仅基于 01-business-background.md 提炼 2 至 3 个核心问题，不得超过 3 个；每个问题说明现状、影响、根因证据和为什么现在必须解决，并定义对应的可验证目标、非目标与验收口径，写入并回读 .technical-solution/sections/02-goals-and-problems.md。不得调研或选择方案。背景变化时上报 background_changed；否则完成时上报 goals_and_problems_defined。
    skills:
      - {id: technical-goals-and-problems, prompt: 使用该 Skill 把业务事实收敛为少量核心问题和可验证目标。, optional: false}

  define_business_constraints_flow:
    prompt: |
      仅基于已完成的业务背景、目标与问题，判断流量形态、数据一致性、延迟、成本、组织协作边界、历史包袱、安全合规和交付窗口中哪些真实适用，写清约束、边界与取舍优先级，写入并回读 .technical-solution/sections/03-business-constraints.md。后续选型必须能回扣这些约束。背景或目标与问题变化时上报最早受影响的 feedback Condition；否则完成时上报 business_constraints_defined。
    skills:
      - {id: technical-business-constraints, prompt: 使用该 Skill 形成能约束后续选型的业务特点与技术约束。, optional: false}

  confirm_technical_problem_flow:
    prompt: |
      使用绑定 Skill 将第 1 至第 3 章发布并回读为稳定飞书业务问题文档，展示本次 Panorama，再等待人的全新明确决定。批准时同时上报 problem_document_published、panorama_card_published 与 technical_problem_approved；修改意见按最早受影响层上报 background_changed、goals_and_problems_changed 或 business_constraints_changed，并同时上报前两个发布事实。Evidence 保存完整原始回复。不得自行批准或修改章节。
    skills:
      - {id: technical-problem-approval, prompt: 使用该 Skill 发布业务问题文档、组织人工审核并分类回流。, optional: false}

  research_solution_options_flow:
    prompt: |
      仅基于已批准的第 1 至第 3 章建立统一评价维度，选择 2 至 3 类真正可行的内部或业界方案进行比较，逐项说明适用场景、优点、缺点、证据和为什么不能直接照搬，写入并回读 .technical-solution/sections/04-research.md。不得提前确定总体架构。上游语义变化时上报最早受影响的 feedback Condition；否则完成时上报 solution_research_completed。
    skills:
      - {id: technical-solution-research, prompt: 使用该 Skill 完成同维度、可追溯且不搬运资料的方案调研。, optional: false}

  design_overall_solution_flow:
    prompt: |
      仅基于已批准问题、约束和调研先给出总体思路，再确定系统边界、职责、核心选型、数据流、控制流和异常流，逐项回扣问题与约束，写入并回读 .technical-solution/sections/05-overall-solution.md 与可独立理解的主架构图 .technical-solution/architecture.mmd。不得展开局部模块细节。上游变化时上报最早受影响的 feedback Condition；否则同时上报 overall_solution_designed 与 architecture_diagram_written。
    skills:
      - {id: technical-overall-solution, prompt: 使用该 Skill 完成总体方案与完整可编辑架构图。, optional: false}

  design_key_solutions_flow:
    prompt: |
      从总体方案中只选择 2 至 3 个最关键模块，逐个按照设计目标、核心机制、关键权衡、异常或边界处理、为什么这样做的顺序展开；必要时补充被正文明确引用的可编辑辅助图，写入并回读 .technical-solution/sections/06-key-modules.md。不得重复总体方案或提前写结果。上游变化时上报最早受影响的 feedback Condition；否则完成时上报 key_modules_designed。
    skills:
      - {id: technical-key-solutions, prompt: 使用该 Skill 形成关键模块的设计闭环。, optional: false}

  record_technical_decisions_flow:
    prompt: |
      基于第 1 至第 6 章记录真正影响方案的核心技术决策。每项列出至少两个可行选择、共同评价维度、最终选择、未选原因、代价、适用边界和触发重评条件；只写真实存在的一致性与性能、实时性与成本、短期交付与长期演进、平台化与定制化等取舍，写入并回读 .technical-solution/sections/07-decisions.md。上游变化时上报最早受影响的 feedback Condition；否则完成时上报 technical_decisions_recorded。
    skills:
      - {id: technical-decision-recording, prompt: 使用该 Skill 把方案选择转化为可追溯的技术决策与取舍。, optional: false}

  confirm_solution_direction_flow:
    prompt: |
      使用绑定 Skill 将第 1 至第 7 章与架构图发布并回读为稳定飞书技术判断文档，展示本次 Panorama，再等待人的全新明确决定。批准时同时上报 solution_document_published、panorama_card_published 与 solution_direction_approved；修改意见按最早受影响层上报 background_changed 至 technical_decisions_changed 中的一项，并同时上报前两个发布事实。Evidence 保存完整原始回复。不得自行批准或修改章节。
    skills:
      - {id: technical-direction-approval, prompt: 使用该 Skill 发布技术判断文档、组织人工审核并分类回流。, optional: false}

  plan_solution_delivery_flow:
    prompt: |
      仅基于已批准的第 1 至第 7 章制定里程碑、灰度策略、风险控制、依赖、跨团队协作、回滚恢复和踩坑处置，给出负责人、阈值与完成信号，写入并回读 .technical-solution/sections/08-delivery-and-risk.md。晋升场景突出 owner 范围，分享场景突出可复制经验。上游变化时上报最早受影响的 feedback Condition；否则完成时上报 delivery_plan_defined。
    skills:
      - {id: technical-solution-delivery, prompt: 使用该 Skill 形成可执行的落地路径与风险控制。, optional: false}

  evaluate_solution_benefits_flow:
    prompt: |
      仅基于已批准方案和落地证据逐项目标整理结果与收益，优先量化稳定性、成本、耗时、资源利用率、转化、研发效率、故障率或 SLA；不能量化时提供接入方数量、复用范围、线上事故变化或业务反馈等明确证据，区分已测、估算、目标和待确认，写入并回读 .technical-solution/sections/09-results.md。上游变化时上报最早受影响的 feedback Condition；否则完成时上报 results_and_benefits_defined。
    skills:
      - {id: technical-solution-benefits, prompt: 使用该 Skill 形成可验证且逐项回扣目标的结果收益。, optional: false}

  write_retrospective_and_roadmap_flow:
    prompt: |
      基于第 1 至第 9 章复盘三件事：哪些判断正确、哪些地方走了弯路、下一阶段如何演进；规划必须说明为什么现在该做、关键里程碑、触发条件和风险，不空喊平台化或智能化，写入并回读 .technical-solution/sections/10-retrospective-and-roadmap.md。上游变化时上报最早受影响的 feedback Condition；否则完成时上报 retrospective_and_roadmap_defined。
    skills:
      - {id: technical-retrospective-planning, prompt: 使用该 Skill 形成有证据的复盘和可执行规划。, optional: false}

  write_summary_flow:
    prompt: |
      最后读取第 1 至第 10 章，用 5 至 8 行总结背景、核心问题、方案一句话、关键结果、个人贡献与团队贡献、后续规划，写入并回读 .technical-solution/sections/00-summary.md。摘要不得引入正文没有的新事实或承诺。晋升场景突出能力证据，分享场景突出方法复用，融合场景兼顾两者。上游变化时上报最早受影响的 feedback Condition；否则完成时上报 summary_defined。
    skills:
      - {id: technical-summary-writing, prompt: 使用该 Skill 从完整章节生成短而完整的摘要。, optional: false}

  write_technical_solution_flow:
    prompt: |
      只组装已确认的 00-summary.md 与第 01 至第 10 章、主架构图、章节明确引用的辅助图和证据，生成 technical-solution.md。正文必须按“0. 摘要、1. 业务背景、2. 目标与问题定义、3. 业务特点与技术约束、4. 业界/业内方案调研、5. 总体方案设计、6. 关键模块设计、7. 核心技术决策与取舍、8. 落地路径与风险控制、9. 结果收益、10. 复盘与后续规划”排列；允许按真实内容生成三级标题，禁止四级标题和手工 1.1 编号。不得增加附录或重新推导上游结论。发现上游语义变化时上报最早受影响的 feedback Condition；写入并回读成功时上报 technical_solution_written。
    skills:
      - {id: technical-solution-writing, prompt: 使用该 Skill 原样保留十一章契约并组装最终文档。, optional: false}

  review_technical_solution_flow:
    prompt: |
      不修改输入，以陌生评委或听众视角冷读 00 至 10 章、technical-solution.md、主架构图与正文引用的辅助图，检查五分钟可理解性、为什么做、问题复杂度、方案取舍、目标结果闭环、贡献边界、复用边界和后续演进，将证据写入 .technical-solution/review.md。无阻塞项时同时上报 technical_solution_review_passed 与 technical_solution_review_written；有阻塞项时只选择最早受影响的 background_changed 至 presentation_changed 中一项，并与 technical_solution_review_written 同时上报。
    skills:
      - {id: technical-solution-review, prompt: 使用该 Skill 检查十一章推导、证据、取舍、贡献和复用闭环。, optional: false}

  confirm_technical_solution_flow:
    prompt: |
      使用绑定 Skill 发布并回读稳定飞书完整技术文档，展示本次 Panorama，再等待人的全新明确决定。批准时同时上报 technical_solution_document_published、panorama_card_published 与 technical_solution_approved 并结束；修改意见只上报最早受影响的 background_changed 至 presentation_changed 中一项，并同时上报前两个发布事实。Evidence 保存完整原始回复。不得自行批准或修改文档。
    skills:
      - {id: technical-solution-approval, prompt: 使用该 Skill 发布完整文档、组织人工终审并分类回流。, optional: false}

  section_artifact_condition:
    prompt: 上报当前 Step 已写入、回读并通过对应语义与证据门禁的正式章节或完整文档路径。
    skills: []
  stage_document_condition:
    prompt: 上报按稳定标题唯一创建或更新且回读验证成功的飞书文档 URL。
    skills: []
  human_approval_condition:
    prompt: 仅在当前 Human Step 收到人的全新明确批准后上报；不得由 Agent 代批。
    skills: []
  panorama_card_published_condition:
    prompt: |
      Human Step 必须展示 renderer 生成的最新 Panorama。只有对应宿主通道成功展示或发送后，panorama_card_published 才输出本次 render 返回的精确 panorama_snapshot_path；失败时上报 blocked，不提交 Result 或选择 Route。
    skills:
      - {id: technical-solution-panorama, prompt: 依据当前 Agent 已知人设执行唯一展示分支，并返回本次 snapshot_path 对应的 panorama_card_published ConditionResult。, optional: false}
  feedback_scope_condition:
    prompt: 从人的完整反馈或审校发现中只选择最早受影响的一章；Evidence 写明原文、保留内容、失效产物和回流 Step。
    skills: []
  architecture_diagram_condition:
    prompt: 上报已写入并回读、与总体方案一致的完整可编辑架构图路径。
    skills: []
  review_condition:
    prompt: 仅在独立审校没有阻塞项时上报通过。
    skills: []
  review_written_condition:
    prompt: 上报 .technical-solution/review.md 路径。
    skills: []
  back_to_earliest_affected_section:
    prompt: 按最早受影响章节回到对应 Step；目标 Step 及其全部下游 Outputs 失效。
    skills: []
